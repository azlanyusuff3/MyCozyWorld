<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cari Cari — Cozy Hidden Objects</title>
<link rel="icon" href="../assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#fdf1df url(sprites/bg_menu.webp) center/cover;font-family:Nunito,sans-serif;color:#3b2a1e;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:8px 10px}
header a{text-decoration:none;color:#3b2a1e;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 #e2c9a8;font-weight:800}
.title{flex:1;font:22px "Lilita One";color:#c8553d;line-height:1}
.title small{display:block;font:800 12px Nunito;color:#8a6a50}
.pill{background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;box-shadow:0 3px 0 #e2c9a8;white-space:nowrap}
#hintBtn{border:0;font:inherit;cursor:pointer;background:#ffd166}
#sceneWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 8px;min-height:0}
#scene{position:relative;width:100%;aspect-ratio:4/3;max-height:100%;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 #d9b994,0 10px 24px #0002;border:4px solid #fff}
#scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.obj{position:absolute;transform:translate(-50%,-50%) rotate(var(--r)) scaleX(var(--f));line-height:1;cursor:pointer;filter:drop-shadow(0 2px 1px #0003);transition:transform .25s}
.obj.found{animation:pop .6s forwards;pointer-events:none}
@keyframes pop{40%{transform:translate(-50%,-50%) scale(1.8);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 6px gold)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.obj.hint{animation:hint 1s 3}
@keyframes hint{50%{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 8px #ff3d7f);transform:translate(-50%,-50%) scale(1.5)}}
.miss{position:absolute;pointer-events:none;font:800 16px Nunito;color:#e63946;transform:translate(-50%,-50%);animation:up .8s forwards}
@keyframes up{to{transform:translate(-50%,-150%);opacity:0}}
#list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 8px 14px}
.item{background:#fff;border-radius:12px;padding:4px 8px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #e2c9a8;min-width:92px}
.item b{font-size:24px}.item span{font-size:12px;line-height:1.1}.item span i{display:block;color:#8a6a50;font-weight:700}
.item.done{opacity:.45;text-decoration:line-through;background:#d8f3dc}
#overlay{position:fixed;inset:0;background:#3b2a1e99;display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#fffaf2;border-radius:24px;padding:22px;text-align:center;width:min(92%,380px);box-shadow:0 8px 0 #d9b994}
.card h1{font:32px "Lilita One";color:#c8553d;margin:0 0 6px}
.card p{margin:6px 0}
.stars{font-size:40px;letter-spacing:4px}
.card button{border:0;font:22px "Lilita One";background:#5cc9a7;color:#fff;padding:10px 26px;border-radius:16px;box-shadow:0 5px 0 #3b9a7d;margin:8px 4px 0;cursor:pointer}
.card button.alt{background:#f4a261;box-shadow:0 5px 0 #c97b3a}
.hide{display:none!important}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.lv button{font:18px "Lilita One";padding:8px 0;margin:0;background:#9fd8f5;box-shadow:0 4px 0 #5fa6c9}
.lv button[disabled]{opacity:.35}

#scene.word{aspect-ratio:1;max-width:min(100%,62vh);background:#fffaf2;display:grid;touch-action:none;padding:4px;gap:2px}
.cell{display:flex;align-items:center;justify-content:center;font:calc(var(--cs)*.6) "Lilita One";color:#3b2a1e;border-radius:6px;background:#fff;position:relative}
.cell.sel{background:#ffd166}.cell.fog{color:transparent;background:radial-gradient(circle at 35% 40%,#fff,#d7dde4);}.cell.fog::after{content:'☁️';position:absolute;font-size:calc(var(--cs)*.45);opacity:.7}.cell.fog.sel{background:#ffe08a}.cell.f{color:#fff}
.cell.hint{animation:hint2 1s 3}@keyframes hint2{50%{background:#ff3d7f;color:#fff}}
.toggle{display:flex;gap:6px;justify-content:center;margin:6px 0}
.toggle button{font:16px "Lilita One";padding:8px 12px;margin:0;background:#e8d5bd;color:#3b2a1e;box-shadow:0 4px 0 #c9ad8a}
.toggle button.on{background:#c8553d;color:#fff;box-shadow:0 4px 0 #8e3626}
.item.word b{font-size:20px}.item.word span{font:15px "Lilita One";letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="../">⌂</a>
    <div class="title" id="title">Cari Cari<small id="sub">Bilik Stor</small></div>
    <div class="pill" id="timer">⏱ 90</div>
    <button class="pill" id="hintBtn">💡 3</button>
  </header>
  <div id="sceneWrap"><div id="scene"></div></div>
  <div id="list"></div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<script>

 {k:'dapur',n:'Dapur Nenek',e:'Grandma\'s Kitchen',wall:'#fbe3c4',floor:'#c9a27a',acc:'#2a9d8f',items:[['🍳','kuali','frying pan'],['🥄','sudu','spoon'],['🍴','garpu','fork'],['🔪','pisau','knife'],['🫖','teko','teapot'],['☕','cawan','cup'],['🍚','nasi','rice'],['🧂','garam','salt'],['🥚','telur','egg'],['🧅','bawang','onion'],['🌶️','cili','chilli'],['🥥','kelapa','coconut'],['🍌','pisang','banana'],['🧺','bakul','basket'],['🕯️','lilin','candle']]},
 {k:'pasar',n:'Pasar Malam',e:'Night Market',wall:'#2b2d42',floor:'#6d597a',acc:'#ffb703',items:[['🍢','satay','satay'],['🌽','jagung','corn'],['🍉','tembikai','watermelon'],['🥭','mangga','mango'],['🍍','nanas','pineapple'],['🎈','belon','balloon'],['🧸','anak patung','teddy bear'],['👟','kasut','shoes'],['🧢','topi','cap'],['🕶️','cermin mata','sunglasses'],['🏮','tanglung','lantern'],['🍦','aiskrim','ice cream'],['🥤','air','drink'],['💡','mentol','light bulb'],['🪀','yoyo','yo-yo']]},
 {k:'bilik',n:'Bilik Tidur',e:'Bedroom',wall:'#cde7f0',floor:'#e9c46a',acc:'#e76f51',items:[['🛏️','katil','bed'],['🧸','teddy','teddy bear'],['📚','buku','books'],['⏰','jam loceng','alarm clock'],['🎒','beg','school bag'],['👕','baju','shirt'],['🧦','stoking','socks'],['🪥','berus gigi','toothbrush'],['🎮','alat main','game pad'],['🖍️','krayon','crayon'],['⚽','bola','ball'],['🪞','cermin','mirror'],['🕹️','joystick','joystick'],['🎧','fon kepala','headphones'],['🧩','puzzle','puzzle']]},
 {k:'taman',n:'Taman Atuk',e:'Grandpa\'s Garden',wall:'#a8dadc',floor:'#80b918',acc:'#55a630',items:[['🌻','bunga matahari','sunflower'],['🍄','cendawan','mushroom'],['🐌','siput','snail'],['🦋','rama-rama','butterfly'],['🐓','ayam','chicken'],['🐈','kucing','cat'],['🪺','sarang','nest'],['🥕','lobak','carrot'],['🍅','tomato','tomato'],['🌵','kaktus','cactus'],['🪨','batu','rock'],['🐸','katak','frog'],['🐝','lebah','bee'],['🚲','basikal','bicycle'],['🪁','layang-layang','kite']]}
];
// Objek pengalih (decoy) — bukan dalam senarai. [id sprite, emoji fallback]
const DECOY=[['d_apple','🍎'],['d_orange','🍊'],['d_grapes','🍇'],['d_strawberry','🍓'],['d_cheese','🧀'],['d_bread','🍞'],['d_cupcake','🧁'],['d_donut','🍩'],['d_cookie','🍪'],['d_ribbon','🎀'],['d_gift','🎁'],['d_yarn','🧶'],['d_thread','🧵'],['d_hat','👒'],['d_glasses','👓'],['d_briefcase','💼'],['d_handbag','👜'],['d_coin','🪙'],['d_gem','💎'],['d_key','🔑'],['d_paperclip','📎'],['d_pin','📌'],['d_ruler','📏'],['d_scissors','✂️'],['d_notebook','📒'],['d_soap','🧼'],['d_sponge','🧽'],['d_tissue','🧻'],['d_magnet','🧲'],['d_bolt','🔩'],['d_gear','⚙️'],['d_toolbox','🧰'],['d_battery','🔋'],['d_plug','🔌'],['d_radio','📻'],['d_phone','☎️'],['d_hourglass','⏳'],['d_umbrella','☂️'],['d_suitcase','🧳'],['d_dice','🎲'],['d_target','🎯'],['d_drum','🥁'],['d_trumpet','🎺'],['d_fish','🐟'],['d_duck','🦆'],['d_bird','🐦'],['d_mouse','🐁'],['d_rabbit','🐇'],['d_turtle','🐢'],['d_leaf','🍂'],['d_flower','🌸'],['d_log','🪵'],['d_can','🥫'],['d_jar','🫙'],['d_honey','🍯'],['d_candy','🍬'],['d_lollipop','🍭'],['d_bell','🔔'],['d_shell','🐚'],['d_feather','🪶']];
const iid=(t,x)=>t.k+'_'+x[2].toLowerCase().replace(/[^a-z]/g,'');
let SPR=new Set();
// ---------- Level config: makin tinggi makin semak ----------
function cfg(lv){
  return {
    theme:THEMES[(lv-1)%THEMES.length],
    targets:Math.min(5+Math.floor((lv-1)/2),10),
    decoys:Math.min(14+lv*7,110+Math.max(0,lv-20)*2,160),
    size:Math.max(9-lv*0.35,4.2),        // % lebar scene
    rot:Math.min(lv*12,180),            // putaran maksimum
    hidePct:Math.min(lv*0.04,0.4),      // kadar objek separa tersorok (pudar/kecil)
    time:lv<=20?Math.max(100-lv*2,60)+(lv>5?lv*3:0):Math.max(120-(lv-20)*2,45), // lepas lv20 masa makin singkat
    clutter:Math.min(Math.floor(lv/2),8) // lapisan perabot latar
  };
}

// ---------- Background SVG ----------
function bgSVG(t,lv,rng){
  const C=cfg(lv);let s=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="none">`;
  s+=`<rect width="400" height="190" fill="${t.wall}"/>`;
  // corak dinding
  for(let x=0;x<400;x+=24)s+=`<rect x="${x}" y="0" width="12" height="190" fill="#fff" opacity=".12"/>`;
  s+=`<rect y="190" width="400" height="110" fill="${t.floor}"/>`;
  for(let y=200;y<300;y+=16)s+=`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#0002"/>`;
  // tingkap
  s+=`<rect x="250" y="30" width="110" height="80" rx="6" fill="#bde0fe" stroke="${t.acc}" stroke-width="6"/><line x1="305" y1="30" x2="305" y2="110" stroke="${t.acc}" stroke-width="4"/><line x1="250" y1="70" x2="360" y2="70" stroke="${t.acc}" stroke-width="4"/>`;
  // rak
  s+=`<rect x="20" y="60" width="150" height="8" fill="${t.acc}"/><rect x="20" y="120" width="150" height="8" fill="${t.acc}"/>`;
  // perabot tambahan ikut level (lebih semak)
  const pals=['#e76f51','#f4a261','#2a9d8f','#8ecae6','#b5838d','#ffb703','#6d597a','#90be6d'];
  for(let i=0;i<C.clutter+2;i++){
    const x=rng()*360,y=150+rng()*110,w=40+rng()*70,h=25+rng()*45,c=pals[i%pals.length];
    s+= i%3==0?`<ellipse cx="${x+w/2}" cy="${y}" rx="${w/2}" ry="${h/3}" fill="${c}" opacity=".85"/>`
               :`<rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="5" fill="${c}" opacity=".9"/><rect x="${x+4}" y="${y-h+4}" width="${w-8}" height="4" fill="#fff" opacity=".35"/>`;
  }
  // corak bertompok (noise) — level tinggi lebih banyak
  for(let i=0;i<lv*6;i++)s+=`<circle cx="${rng()*400}" cy="${rng()*300}" r="${2+rng()*6}" fill="${pals[i%8]}" opacity=".35"/>`;
  return s+'</svg>';
}


// ---------- State ----------
let LV=1,best=JSON.parse(localStorage.getItem('cari_stars')||'{}');
let targets=[],left=0,time=0,tick=null,hints=3,playing=false;
const $=id=>document.getElementById(id);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= MOD CARI PERKATAAN (word search) =================
let MODE=localStorage.getItem('cari_mode')||'objek',LANG=localStorage.getItem('cari_lang')||'mix';
const K=()=>MODE==='kata'?'w':'';

// Bank perkataan tambahan (mod perkataan sahaja) — [emoji, BM, EN]
const WCATS=[
 {n:'Haiwan',items:[['🐈','kucing','cat'],['🐕','anjing','dog'],['🐓','ayam','chicken'],['🐄','lembu','cow'],['🐐','kambing','goat'],['🐘','gajah','elephant'],['🐅','harimau','tiger'],['🐒','monyet','monkey'],['🐍','ular','snake'],['🐊','buaya','crocodile'],['🐢','penyu','turtle'],['🐟','ikan','fish'],['🐦','burung','bird'],['🦆','itik','duck'],['🐸','katak','frog'],['🦋','kupukupu','butterfly'],['🐜','semut','ant'],['🐝','lebah','bee'],['🐇','arnab','rabbit'],['🦌','rusa','deer'],['🐎','kuda','horse'],['🐁','tikus','mouse']]},
 {n:'Buah-buahan',items:[['🍌','pisang','banana'],['🥭','mangga','mango'],['🍍','nanas','pineapple'],['🍉','tembikai','watermelon'],['🍎','epal','apple'],['🍊','oren','orange'],['🍇','anggur','grape'],['🥥','kelapa','coconut'],['🍋','limau','lemon'],['🍓','strawberi','strawberry'],['🍈','betik','papaya'],['🍐','pir','pear'],['🍒','ceri','cherry'],['🥝','kiwi','kiwi'],['🍑','pic','peach']]},
 {n:'Makanan',items:[['🍚','nasi','rice'],['🍜','mi','noodles'],['🍞','roti','bread'],['🥚','telur','egg'],['🧀','keju','cheese'],['🍗','ayam goreng','fried chicken'],['🍲','sup','soup'],['🍰','kek','cake'],['🍪','biskut','biscuit'],['🍦','aiskrim','ice cream'],['🥛','susu','milk'],['☕','kopi','coffee'],['🍵','teh','tea'],['🍯','madu','honey'],['🧂','garam','salt'],['🍬','gula gula','candy'],['🥗','salad','salad'],['🌶️','cili','chilli']]},
 {n:'Badan',items:[['👁️','mata','eye'],['👂','telinga','ear'],['👃','hidung','nose'],['👄','mulut','mouth'],['🦷','gigi','tooth'],['✋','tangan','hand'],['🦶','kaki','foot'],['💪','lengan','arm'],['🧠','otak','brain'],['❤️','jantung','heart'],['👅','lidah','tongue'],['💇','rambut','hair'],['🦴','tulang','bone'],['👆','jari','finger'],['🦵','lutut','knee']]},
 {n:'Warna & Bentuk',items:[['🔴','merah','red'],['🔵','biru','blue'],['🟢','hijau','green'],['🟡','kuning','yellow'],['⚫','hitam','black'],['⚪','putih','white'],['🟣','ungu','purple'],['🟠','jingga','orange'],['🟤','coklat','brown'],['🌸','merah jambu','pink'],['⭕','bulat','circle'],['🔺','segi tiga','triangle'],['⬛','segi empat','square'],['⭐','bintang','star'],['💖','hati','heart']]},
 {n:'Kerjaya',items:[['👨‍⚕️','doktor','doctor'],['👩‍🏫','cikgu','teacher'],['👮','polis','police'],['👨‍🚒','bomba','fireman'],['👨‍🍳','tukang masak','chef'],['👨‍🌾','petani','farmer'],['👷','buruh','builder'],['🧑‍✈️','juruterbang','pilot'],['👩‍⚕️','jururawat','nurse'],['🧑‍🎨','pelukis','artist'],['🧑‍🔧','mekanik','mechanic'],['💂','askar','soldier'],['🎣','nelayan','fisherman'],['👨‍💻','jurutera','engineer']]},
 {n:'Sukan & Main',items:[['⚽','bola sepak','football'],['🏸','badminton','badminton'],['🏊','renang','swimming'],['🚴','berbasikal','cycling'],['🏃','lari','running'],['🏀','bola keranjang','basketball'],['🏓','ping pong','ping pong'],['🥋','silat','martial art'],['🪁','wau','kite'],['🎯','sasaran','target'],['🏆','piala','trophy'],['🥇','pingat','medal'],['🎳','boling','bowling'],['⛸️','luncur','skate']]},
 {n:'Kenderaan',items:[['🚗','kereta','car'],['🚌','bas','bus'],['🚲','basikal','bicycle'],['🏍️','motosikal','motorcycle'],['✈️','kapal terbang','aeroplane'],['🚢','kapal','ship'],['🚂','kereta api','train'],['🚁','helikopter','helicopter'],['🚕','teksi','taxi'],['🚑','ambulans','ambulance'],['🚒','jentera bomba','fire engine'],['🛶','sampan','canoe'],['🚜','traktor','tractor'],['🚀','roket','rocket'],['🛵','skuter','scooter']]},
 {n:'Alam',items:[['☀️','matahari','sun'],['🌙','bulan','moon'],['⭐','bintang','star'],['☁️','awan','cloud'],['🌧️','hujan','rain'],['🌈','pelangi','rainbow'],['⛰️','gunung','mountain'],['🌊','laut','sea'],['🏝️','pulau','island'],['🌳','pokok','tree'],['🌸','bunga','flower'],['🍃','daun','leaf'],['🔥','api','fire'],['💧','air','water'],['⚡','kilat','lightning'],['🪨','batu','stone'],['🏖️','pantai','beach'],['🌲','hutan','forest']]},
 {n:'Sekolah',items:[['📚','buku','book'],['✏️','pensel','pencil'],['🖊️','pen','pen'],['📏','pembaris','ruler'],['✂️','gunting','scissors'],['🎒','beg','bag'],['🧮','sempoa','abacus'],['📓','nota','notebook'],['🏫','sekolah','school'],['👩‍🏫','guru','teacher'],['🪑','kerusi','chair'],['🖍️','krayon','crayon'],['🔔','loceng','bell'],['🗺️','peta','map'],['🔬','mikroskop','microscope'],['🧑‍🎓','murid','student']]}
];
const WALL=()=>THEMES.concat(WCATS);
function wcfg(lv){
  const D=[[0,1],[1,0]];if(lv>2)D.push([1,1]);if(lv>5)D.push([-1,1]);
  if(lv>8)D.slice().forEach(d=>D.push([-d[0],-d[1]]));
  const A=WALL();
  return{theme:A[(lv-1)%A.length],fog:lv<10?0:Math.min(.12+(lv-10)*.01,.35),n:Math.min(7+Math.floor(lv/2),14),words:Math.min(5+Math.floor((lv-1)/2),10),dirs:D,time:lv<=20?Math.min(120+lv*6,300):Math.max(240-(lv-20)*4,90)};
}
let fogSet=new Set(),hintUsed=0,grid=[],wtargets=[],selStart=null,selCells=[];
const clean=s=>s.toUpperCase().replace(/[^A-Z]/g,'');
function startWord(lv){
  LV=lv;const C=wcfg(lv),t=C.theme,rng=mulberry(lv*131+Date.now()%1000);
  $('sub').textContent=`Level ${lv} · ${t.n}`;
  const N=C.n;grid=Array.from({length:N},()=>Array(N).fill(''));
  const pPic=lv<5?0:Math.min((lv-4)*.08,.5),pTr=lv<13?0:Math.min(.2+(lv-13)*.02,.45);
  let cand=shuffle(t.items.map(x=>{const bm=LANG==='bm'||(LANG==='mix'&&rng()<.5),w=clean(bm?x[1]:x[2]),other=bm?x[2]:x[1],r=rng();
    let ty=r<pTr&&clean(other)!==w?'trans':r<pTr+pPic?'pic':'word';
    const show=ty==='word'?(bm?x[1]:x[2]).toUpperCase():ty==='trans'?`${other} → ${bm?'BM':'EN'}`:`${bm?'BM':'EN'} · ${w.length} huruf`;
    return{w,show,e:ty==='trans'?'🔁':x[0],lang:bm?'BM':'EN',ty,ans:(bm?x[1]:x[2]).toUpperCase()}}).filter(o=>o.w.length>=3&&o.w.length<=N),rng);
  wtargets=[];
  for(const o of cand){if(wtargets.length>=C.words)break;if(wtargets.some(x=>x.w===o.w))continue;
    for(let a=0;a<300;a++){const d=C.dirs[Math.floor(rng()*C.dirs.length)],L=o.w.length;
      const r0=Math.floor(rng()*N),c0=Math.floor(rng()*N),r1=r0+d[0]*(L-1),c1=c0+d[1]*(L-1);
      if(r1<0||r1>=N||c1<0||c1>=N)continue;let ok=true;
      for(let i=0;i<L;i++){const g=grid[r0+d[0]*i][c0+d[1]*i];if(g&&g!==o.w[i]){ok=false;break}}
      if(!ok)continue;for(let i=0;i<L;i++)grid[r0+d[0]*i][c0+d[1]*i]=o.w[i];
      o.r=r0;o.c=c0;o.d=d;wtargets.push(o);break;}}
  const AB='ABCDEFGHIJKLMNOPRSTUW';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])grid[r][c]=AB[Math.floor(rng()*AB.length)];
  fogSet=new Set();for(let i=0;i<N*N;i++)if(rng()<C.fog)fogSet.add(i);
  const sc=$('scene');sc.className='word';sc.style.gridTemplateColumns=`repeat(${N},1fr)`;
  sc.innerHTML=grid.flat().map((ch,i)=>`<div class="cell${fogSet.has(i)?' fog':''}" data-r="${Math.floor(i/N)}" data-c="${i%N}">${ch}</div>`).join('');
  sc.style.setProperty('--cs',(sc.clientWidth/N)+'px');
  $('list').innerHTML=wtargets.map((o,i)=>`<div class="item word" id="it${i}"><b>${o.e}</b><span>${o.show}</span></div>`).join('');
  left=wtargets.length;time=0;hints=3;hintUsed=0;$('hintBtn').textContent='💡 3';
  $('overlay').classList.add('hide');playing=true;
  clearInterval(tick);tick=setInterval(()=>{time++;showTime()},1000);showTime();
}
const cellAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.classList.contains('cell')?e:null};
function line(a,b){const r0=+a.dataset.r,c0=+a.dataset.c,r1=+b.dataset.r,c1=+b.dataset.c,dr=r1-r0,dc=c1-c0;
  if(dr&&dc&&Math.abs(dr)!==Math.abs(dc))return null;const L=Math.max(Math.abs(dr),Math.abs(dc)),sr=Math.sign(dr),scn=Math.sign(dc),out=[];
  for(let i=0;i<=L;i++)out.push($('scene').children[(r0+sr*i)*grid.length+c0+scn*i]);return out}
function paint(){document.querySelectorAll('.cell.sel').forEach(c=>c.classList.remove('sel'));selCells.forEach(c=>c.classList.add('sel'))}
$('scene').addEventListener('pointerdown',e=>{if(MODE!=='kata'||!playing)return;const c=cellAt(e.clientX,e.clientY);if(!c)return;selStart=c;selCells=[c];paint();$('scene').setPointerCapture(e.pointerId)},true);
$('scene').addEventListener('pointermove',e=>{if(MODE!=='kata'||!selStart)return;const c=cellAt(e.clientX,e.clientY);if(!c)return;const l=line(selStart,c);if(l){selCells=l;paint()}});
addEventListener('pointerup',()=>{if(MODE!=='kata'||!selStart)return;selStart=null;
  const s=selCells.map(c=>c.textContent).join(''),rs=[...s].reverse().join('');
  const i=wtargets.findIndex(o=>!o.found&&(o.w===s||o.w===rs));
  if(i>=0&&s.length>1){const o=wtargets[i];o.found=true;const col=`hsl(${(i*47)%360} 65% 55%)`;
    selCells.forEach(c=>{c.classList.add('f');c.style.background=col;const r=+c.dataset.r,cc=+c.dataset.c,N=grid.length;
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const rr=r+a,c2=cc+b;if(rr>=0&&rr<N&&c2>=0&&c2<N)$('scene').children[rr*N+c2].classList.remove('fog')}});
    const it=$('it'+i);it.classList.add('done');if(o.ty!=='word')it.querySelector('span').textContent=o.ans;buzz(20);
    if(--left===0)end(true);}
  else if(s.length>1){buzz(15)}
  selCells=[];paint();});

function start(lv){
  if(MODE==='kata')return startWord(lv);
  $('scene').className='';$('scene').style.gridTemplateColumns='';
  LV=lv;const C=cfg(lv),t=C.theme,rng=mulberry(lv*977+Date.now()%1000);
  $('sub').textContent=`Level ${lv} · ${t.n}`;
  const sc=$('scene');
  if(SPR.has('bg_'+t.k)){sc.innerHTML=`<img class="bg" src="sprites/bg_${t.k}.webp" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`;rng();}
  else sc.innerHTML=bgSVG(t,lv,rng);
  targets=shuffle(t.items.slice(),rng).slice(0,C.targets);
  const tEm=new Set(targets.map(x=>x[0]));
  // decoy: dari pool + objek tema yang tak dicari
  let pool=DECOY.map(d=>({id:d[0],e:d[1]})).concat(t.items.filter(x=>!tEm.has(x[0])).map(x=>({id:iid(t,x),e:x[0]}))).filter(o=>!tEm.has(o.e));
  const objs=[];
  for(let i=0;i<C.decoys;i++)objs.push({...pool[Math.floor(rng()*pool.length)],t:false});
  targets.forEach((x,i)=>objs.push({id:iid(t,x),e:x[0],t:true,i}));
  shuffle(objs,rng);
  objs.forEach((o,k)=>{
    const d=document.createElement('div');d.className='obj';
    if(SPR.has(o.id)){const im=new Image();im.src='sprites/'+o.id+'.webp';im.draggable=false;im.style.cssText='width:1.2em;height:1.2em;object-fit:contain;display:block;pointer-events:none';d.appendChild(im)}else d.textContent=o.e;
    let sz=C.size*(0.75+rng()*0.6);
    if(o.t&&rng()<C.hidePct){sz*=0.7;d.style.opacity=.8}
    d.style.left=(5+rng()*90)+'%';d.style.top=(8+rng()*86)+'%';
    d.style.fontSize=`calc(${sz} * var(--w))`;
    d.style.setProperty('--r',((rng()*2-1)*C.rot)+'deg');d.style.setProperty('--f',rng()<.5?1:-1);
    d.style.zIndex=o.t?(rng()<C.hidePct?1:5+Math.floor(rng()*50)):Math.floor(rng()*50);
    if(o.t)d.dataset.t=o.i;
    sc.appendChild(d);
  });
  sizeVar();
  $('list').innerHTML=targets.map((x,i)=>`<div class="item" id="it${i}"><b>${SPR.has(iid(t,x))?`<img src="sprites/${iid(t,x)}.webp" style="width:28px;height:28px;object-fit:contain;vertical-align:middle">`:x[0]}</b><span>${x[1]}<i>${x[2]}</i></span></div>`).join('');
  left=targets.length;time=C.time;hints=3;$('hintBtn').textContent='💡 3';
  $('overlay').classList.add('hide');playing=true;
  clearInterval(tick);tick=setInterval(()=>{time--;showTime();if(time<=0)end(false)},1000);showTime();
}
function sizeVar(){const sc=$('scene');sc.style.setProperty('--w',sc.clientWidth/100+'px')}
addEventListener('resize',sizeVar);
function showTime(){if(MODE==='kata'){$('timer').textContent='☕ '+Math.floor(time/60)+':'+String(time%60).padStart(2,'0');$('timer').style.color='';return}$('timer').textContent='⏱ '+Math.max(time,0);$('timer').style.color=time<=10?'#e63946':''}

$('scene').addEventListener('pointerdown',e=>{
  if(!playing||MODE==='kata')return;
  const o=e.target.closest('.obj');
  if(o&&o.dataset.t!==undefined){
    o.classList.add('found');$('it'+o.dataset.t).classList.add('done');buzz(20);
    if(--left===0)end(true);
  }else{
    time=Math.max(time-3,0);showTime();buzz([30,40,30]);
    const r=$('scene').getBoundingClientRect(),m=document.createElement('div');
    m.className='miss';m.textContent='-3s';m.style.left=(e.clientX-r.left)+'px';m.style.top=(e.clientY-r.top)+'px';
    $('scene').appendChild(m);setTimeout(()=>m.remove(),800);
  }
});
$('hintBtn').onclick=()=>{
  if(!playing||hints<=0)return;
  if(MODE==='kata'){const o=wtargets.find(x=>!x.found);if(!o)return;hints--;$('hintBtn').textContent='💡 '+hints;hintUsed++;const c=$('scene').children[o.r*grid.length+o.c];c.classList.remove('fog');c.classList.remove('hint');void c.offsetWidth;c.classList.add('hint');return}
  const o=[...document.querySelectorAll('.obj[data-t]:not(.found)')][0];if(!o)return;
  hints--;$('hintBtn').textContent='💡 '+hints;o.style.zIndex=99;o.classList.remove('hint');void o.offsetWidth;o.classList.add('hint');
};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}

function end(win){
  playing=false;clearInterval(tick);
  const C=MODE==='kata'?wcfg(LV):cfg(LV);let st=0;
  if(win){st=MODE==='kata'?Math.max(3-hintUsed,1):time>C.time*.5?3:time>C.time*.2?2:1;
    best[K()+LV]=Math.max(best[K()+LV]||0,st);setUnl(Math.max(unl(),LV+1));
    try{localStorage.setItem('cari_stars',JSON.stringify(best))}catch(_){}}
  $('card').innerHTML=win
   ?`<h1>Jumpa semua! 🎉</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><p>${MODE==='kata'?'Masa: '+Math.floor(time/60)+'m '+(time%60)+'s · Tanpa hint = ⭐⭐⭐':'Baki masa: '+time+'s'}</p><button onclick="start(${LV+1})">Level ${LV+1} ▶</button><button class="alt" onclick="menu()">Menu</button>`
   :`<h1>Masa tamat ⏰</h1><p>Tinggal ${left} lagi ${MODE==='kata'?'perkataan':'objek'} tak jumpa.</p><button onclick="start(${LV})">Cuba lagi</button><button class="alt" onclick="menu()">Menu</button>`;
  $('overlay').classList.remove('hide');
}
const unl=()=>+(localStorage.getItem('cari_unlock'+K())||1);
function setUnl(v){try{localStorage.setItem('cari_unlock'+K(),v)}catch(_){}}
let PG=null;
function setMode(m){MODE=m;PG=null;try{localStorage.setItem('cari_mode',m)}catch(_){}menu()}
function setLang(l){LANG=l;try{localStorage.setItem('cari_lang',l)}catch(_){}menu()}
function menu(){
  playing=false;clearInterval(tick);const u=unl();
  PG=Math.min(PG??Math.floor((u-1)/30),Math.floor((u-1)/30));const s0=PG*30+1;
  let g='';for(let i=s0;i<s0+30;i++){const b=best[K()+i];g+=`<button ${i>u?'disabled':''} onclick="start(${i})">${i}<br><small style="font-size:10px">${b?'⭐'.repeat(b):''}</small></button>`}
  const tb=(cur,v,l,f)=>`<button class="${cur===v?'on':''}" onclick="${f}('${v}')">${l}</button>`;
  $('card').innerHTML=`${SPR.has('logo')?'<img src="sprites/logo.webp" style="width:80%;max-height:120px;object-fit:contain">':'<h1>🔍 Cari Cari</h1>'}
  <div class="toggle">${tb(MODE,'objek','🧸 Cari Barang','setMode')}${tb(MODE,'kata','🔤 Cari Perkataan','setMode')}</div>
  ${MODE==='kata'?`<div class="toggle">${tb(LANG,'bm','BM','setLang')}${tb(LANG,'en','English','setLang')}${tb(LANG,'mix','Campur','setLang')}</div><p>Leret jari atas huruf untuk bulatkan perkataan. Santai je, tak ada had masa ☕</p>`:'<p>Jumpa semua barang dalam senarai sebelum masa habis!</p>'}
  <button onclick="start(${u})">▶ Teruskan Level ${u}</button>
  <p style="font-size:13px;color:#8a6a50">Level tanpa had ♾️${MODE==='kata'?'':' · Salah = −3s'}</p><div class="lv">${g}</div>
  <div class="toggle"><button ${PG<=0?'disabled':''} onclick="PG--;menu()">◀</button><button class="on">${s0}–${s0+29}</button><button ${s0+30>u?'disabled':''} onclick="PG++;menu()">▶</button></div>`;
  $('overlay').classList.remove('hide');
}
fetch('sprites/list.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[]).then(l=>{SPR=new Set(l);menu()});
</script>
