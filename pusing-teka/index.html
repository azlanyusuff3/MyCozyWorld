<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:Nunito,sans-serif;color:#fff;overflow:hidden;
 background:linear-gradient(#10002b66,#10002bb3 45%,#10002bcc),url(sprites/bg_studio.webp) center/cover,radial-gradient(ellipse at 50% -10%,#ff5fa2 0,#7b2cbf 35%,#240046 70%,#10002b 100%);background-color:#240046}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(circle at 10% 20%,#ffd16633 0 2px,transparent 3px),radial-gradient(circle at 80% 12%,#ffd16633 0 2px,transparent 3px),
 conic-gradient(from 200deg at 15% -5%,transparent 0 10deg,#ffffff10 10deg 18deg,transparent 18deg 360deg),
 conic-gradient(from 140deg at 85% -5%,transparent 0 10deg,#ffffff10 10deg 18deg,transparent 18deg 360deg)}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px}
header{display:flex;align-items:center;gap:6px}
header a img{height:24px;display:block}header a{color:#fff;text-decoration:none;background:#ffffff22;border-radius:12px;padding:5px 9px;font-weight:800;font-size:13px}
.logo img{height:44px;max-width:100%;object-fit:contain;filter:drop-shadow(0 3px 6px #0008)}.logo{flex:1;text-align:center;font:24px/1 "Lilita One";letter-spacing:1px;color:#ffd166;text-shadow:0 3px 0 #c9184a,0 0 14px #ffd16688}
.live{background:#e5383b;border-radius:8px;padding:3px 7px;font-weight:800;font-size:11px;white-space:nowrap}
.live b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:4px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#roundInfo{display:flex;justify-content:space-between;font-weight:800;font-size:12px;opacity:.9}
#board{background:linear-gradient(#0b3d91,#05204f);border:4px solid #ffd166;border-radius:14px;padding:8px 4px;box-shadow:0 0 0 3px #c9184a,0 0 22px #ffd16666;display:flex;flex-direction:column;gap:4px;align-items:center;min-height:100px;justify-content:center}
.row{display:flex;gap:3px}
.tile{width:24px;height:30px;border-radius:4px;background:url(sprites/tile_blank.webp) center/100% 100%;display:flex;align-items:center;justify-content:center;font:20px "Lilita One";color:#10002b;transition:.3s}
.tile.l{background:url(sprites/tile_board.webp) center/100% 100%}
.tile.l span{opacity:0}
.tile.l.show span{opacity:1}
.tile.l.flash{filter:drop-shadow(0 0 8px #ffd166) brightness(1.15);transform:scale(1.15)}
.tile.sp{background:none}
#cat{font:16px "Lilita One";color:#ffd166;text-align:center;letter-spacing:1px}
#stage{position:relative;display:flex;gap:6px;align-items:center;min-height:0;flex:1}
#wheelWrap{position:relative;flex:0 0 auto;width:min(40vw,190px);aspect-ratio:1;margin:4px 14px 0}#frame{position:absolute;width:142%;left:-20.3%;top:-12%;pointer-events:none;filter:drop-shadow(0 6px 10px #0008)}
#wheel{width:100%;height:100%;filter:drop-shadow(0 6px 10px #0008)}
#pointer{position:absolute;top:-17%;left:50%;transform:translateX(-50%);width:15%;pointer-events:none;filter:drop-shadow(0 3px 3px #0008);z-index:2}
#side{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;height:100%}
#host{display:flex;gap:6px;align-items:flex-start}
#host .face{width:62px;height:62px;flex:0 0 62px}#host .face img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px #0008)}
#hostTxt{background:#fff;color:#240046;border-radius:12px;border-top-left-radius:2px;padding:6px 8px;font-weight:800;font-size:13px;line-height:1.25;flex:1;min-height:40px}
#host small{display:block;font-size:10px;color:#c9184a}
#feed{flex:1;background:#00000040;border-radius:12px;padding:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;font-size:11.5px;min-height:70px;position:relative}
#feed:before{content:"💬 KOMEN PENONTON";position:absolute;top:4px;left:8px;font-size:9px;font-weight:800;opacity:.6}
.cm{animation:cin .35s;line-height:1.25}
.cm b{color:#ffd166}
@keyframes cin{from{transform:translateX(20px);opacity:0}}
#podiums{display:flex;gap:5px}
.pod{flex:1;position:relative;padding:0 4px 8px;text-align:center;background:url(sprites/podium.webp) bottom/100% 62% no-repeat;transition:.3s;border-radius:12px}
.pod.turn{transform:translateY(-3px);filter:drop-shadow(0 0 10px #ffd166)}
.pod .av{height:58px;margin-bottom:-4px}.pod .av img{height:100%;filter:drop-shadow(0 3px 3px #0007)}.pod.turn .av img{animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.pod .nm{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .rb{font:17px "Lilita One";color:#ffd166}
.pod .tt{font-size:10px;opacity:.75}
#actions{display:flex;gap:6px}
button{font-family:inherit;cursor:pointer}
.act img{height:24px;vertical-align:middle;margin-right:3px;filter:drop-shadow(0 2px 1px #0006)}.act{flex:1;border:0;border-radius:12px;padding:10px 4px;font:16px "Lilita One";color:#fff;letter-spacing:.5px;box-shadow:0 4px 0 #0006}
.act:disabled{opacity:.35;cursor:default}
#bSpin{background:#e5383b}#bVowel{background:#2a9d8f}#bSolve{background:#f77f00}
#keys{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.k{border:0;border-radius:8px;padding:8px 0;font:16px "Lilita One";background:#fff;color:#240046;box-shadow:0 3px 0 #bbb}
.k.v{background:#b8f2e6}
.k:disabled{opacity:.25}
.k.used{background:#555;color:#999;opacity:.3}
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-40px;font-size:26px;animation:rise 2.6s ease-out forwards}
@keyframes rise{to{transform:translateY(-75vh) translateX(var(--dx));opacity:0}}
.modal{position:fixed;inset:0;background:#10002bdd;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.hide{display:none}
.card{background:linear-gradient(#3c096c,#240046);border:3px solid #ffd166;border-radius:18px;padding:18px;text-align:center;max-width:380px;width:100%}
.card h2{font:30px "Lilita One";color:#ffd166;margin:0 0 6px;text-shadow:0 3px 0 #c9184a}
.card p{margin:6px 0;font-weight:700;line-height:1.35}
.card input{width:100%;font:20px "Lilita One";text-transform:uppercase;padding:10px;border-radius:10px;border:0;text-align:center;margin:8px 0}
.big{border:0;border-radius:14px;padding:12px 20px;font:20px "Lilita One";background:#e5383b;color:#fff;box-shadow:0 5px 0 #8d0801;margin:4px}
.big.alt{background:#2a9d8f;box-shadow:0 5px 0 #14524a}
#timer{font:40px "Lilita One";color:#ffd166}
#sign img{display:block;width:110px;margin:0 auto 4px;filter:drop-shadow(0 4px 6px #000a)}#sign{text-align:center;position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);font:44px "Lilita One";color:#ffd166;text-shadow:0 4px 0 #c9184a,0 0 20px #000;z-index:5;pointer-events:none;white-space:nowrap}
#sign.go{animation:sign 1.6s}
@keyframes sign{15%{transform:translate(-50%,-50%) scale(1.15)}25%,80%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(0)}}
@media(max-height:700px){.tile{height:24px;font-size:16px;width:21px}.k{padding:6px 0}.act{padding:8px 4px}#wheelWrap{width:min(42vw,190px)}}
</style>

 <header>

<div class="modal" id="mStart"><div class="card">
 <img src="sprites/logo.webp" alt="PUSING TEKA" style="width:100%;max-width:300px"><img src="sprites/host_excited.webp" alt="" style="width:110px;display:block;margin:-6px auto 0">
 <p>📺 Malam ni kau jadi <b>peserta</b> dalam rancangan game show paling hangat di TV Cozy!</p>
 <p style="font-size:13px;opacity:.85">Pusing roda, teka huruf konsonan, beli vokal RM250, dan jawab teka-teki. Jaga-jaga petak <b>MUFLIS</b>!</p>

<script>
'use strict';
// ---------- DATA ----------
const PUZ={
 'PERIBAHASA':['BAGAI AUR DENGAN TEBING','SEPERTI KATAK DI BAWAH TEMPURUNG','AIR DICINCANG TIDAK AKAN PUTUS','HARAPKAN PAGAR PAGAR MAKAN PADI','SEDIKIT SEDIKIT LAMA LAMA JADI BUKIT','BAGAI MENATANG MINYAK YANG PENUH','ADA UDANG DI SEBALIK BATU','BERAT SAMA DIPIKUL RINGAN SAMA DIJINJING','BIAR LAMBAT ASAL SELAMAT','MALU BERTANYA SESAT JALAN'],
 'SIMPULAN BAHASA':['KAKI BANGKU','BUAH TANGAN','TANGAN TERBUKA','ANAK EMAS','KEPALA ANGIN','BESAR KEPALA','OTAK UDANG','LIDAH BERCABANG','MULUT MURAI','KUTU BUKU','MAKAN TANGAN','BERAT TULANG'],
 'MAKANAN MALAYSIA':['NASI LEMAK SAMBAL SOTONG','ROTI CANAI BANJIR','TEH TARIK KURANG MANIS','CENDOL PULUT','SATE KAJANG','LAKSA PENANG','NASI KERABU','AYAM PERCIK','KEROPOK LEKOR','MEE GORENG MAMAK','AIS KACANG','CUCUR UDANG','KUIH LAPIS','NASI DAGANG'],
 'TEMPAT MENARIK DI MALAYSIA':['MENARA BERKEMBAR PETRONAS','GUA TEMPURUNG','PULAU LANGKAWI','BUKIT FRASER','CAMERON HIGHLANDS','JAMBATAN PULAU PINANG','TASIK KENYIR','GUNUNG KINABALU','BANDAR HILIR MELAKA','PASAR BESAR SITI KHADIJAH'],
 'PERALATAN DAPUR':['PERIUK NASI ELEKTRIK','LESUNG BATU','SENDUK KAYU','PARUT KELAPA','TERMOS AIR PANAS','KUALI BESI','CEREK ELEKTRIK','PISAU POTONG','PENAPIS SANTAN','KUKUSAN BULUH'],
 'AKTIVITI HARI RAYA':['BALIK KAMPUNG','BAKAR LEMANG','PASANG PELITA','DUIT RAYA SAMPUL HIJAU','RUMAH TERBUKA','MAIN BUNGA API','BAJU MELAYU SEDONDON'],
 'PERMAINAN TRADISIONAL':['BALING SELIPAR','LOMPAT GETAH','MAIN GULI','WAU BULAN','GASING PANGKAH','SEPAK RAGA','TEPUK AMAI AMAI','BATU SEREMBAN','POLIS SENTRI']
};
const VOW='AEIOU',ALL='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const FREQ='NAKIERSMGLTUDBPHYJCWOFZVQX'; // kekerapan huruf BM (anggaran)
const SEG=[500,300,700,'MUFLIS',400,600,350,800,'HILANG',450,550,300,900,'DURIAN',400,650,500,'MUFLIS',1000,300,750,'HILANG',600,350];
const SEGCOL=['#e5383b','#f77f00','#fcbf49','#2a9d8f','#4361ee','#9d4edd','#ff5fa2','#06d6a0'];
const AUD=['MakCikKiah_KB','abg_lori88','SitiCupcake','PakAbuJohor','adikMimi07','rempit_cool','AuntyLim','AhmadGeng','kakNor_masak','budakUTM','cikgu_Zura','RajKumarr','NenekOnline','farah.sweet','DinPenyu'];
const RIVALS=[{n:'Mak Cik Kiah',av:'👵🏽',k:'kiah',style:'berani'},{n:'Pak Abu',av:'👨🏽‍🦳',k:'abu',style:'vokal'},{n:'Adik Mimi',av:'👧🏻',k:'mimi',style:'rawak'}];
const KEYOF=p=>p.k||({'Mak Cik Kiah':'kiah','Pak Abu':'abu','Adik Mimi':'mimi'}[p.n])||'player';
function mood(i,m){if(P[i]){P[i].mood=m;renderPods()}}

// ---------- STATE ----------
let P=[],cur=0,round=1,answer='',cat='',used=new Set(),phase='off',spinVal=0,rot=0,usedPuz=new Set();
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];

// ---------- AUDIO ----------
let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d,t='sine',v=.15,when=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+when+d);o.connect(g).connect(c.destination);o.start(c.currentTime+when);o.stop(c.currentTime+when+d)}catch(e){}}
const sTick=()=>tone(1800,.03,'square',.05);
const sDing=n=>{for(let i=0;i<Math.min(n,6);i++)tone(1320,.25,'triangle',.18,i*.18)};
const sBuzz=()=>tone(120,.5,'sawtooth',.18);
const sFan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.12));
function sClap(dur=1.6,vol=.25){try{const c=ac(),len=c.sampleRate*dur,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<len;i++){const env=Math.min(1,i/(c.sampleRate*.1))*(1-i/len);d[i]=(Math.random()*2-1)*env*(Math.random()<.3?1:.3)}
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.value=1500;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start()}catch(e){}}
function sAww(){tone(400,.6,'sine',.1);tone(300,.7,'sine',.1,.3)}

// ---------- HOST / AUDIENCE ----------
let hostT;function host(t,m){$('hostLine').textContent=t;$('hostImg').src='sprites/host_'+(m||'idle')+'.webp';clearTimeout(hostT);if(m)hostT=setTimeout(()=>$('hostImg').src='sprites/host_idle.webp',2500)}
function comment(t,who){const f=$('feed'),d=document.createElement('div');d.className='cm';d.innerHTML='<b>@'+(who||rnd(AUD))+'</b> '+t;f.appendChild(d);while(f.children.length>7)f.removeChild(f.firstChild)}
function chatter(kind,n=2){const L=AUDL[kind];if(!L)return;const pool=[...L];for(let i=0;i<n;i++){const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];if(t)setTimeout(()=>comment(t.replace('{p}',P[cur]?P[cur].n:'')),i*550+Math.random()*300)}}
const AUDL={
 spin:['pusingggg 🎡','jangan muflis plsss 🙏','RM1000 RM1000!!','debar weh 😬','tengok roda tu laju gila','ayuh {p}!'],
 big:['WAAAH besar tu 🤑','jackpot ni geng','{p} hari ni bertuah','👏👏👏'],
 muflis:['MUFLISSS 😭😭','alamak kesian {p}','sakit hati aku tengok 💔','HAHAHA maaf tapi kelakar','roda tu kejam'],
 lose:['hilang giliran pulak 🤦','tak pe tak pe next time','roda dah tak sayang {p}'],
 hit:['betul tu!','power {p} 💪','nice pick','aku pun nak teka huruf tu','dah nampak jawapan ke belum?'],
 miss:['eh takde la 😅','huruf tu memang tak logik','aku dah agak','alamak','haih {p}..'],
 vowel:['beli vokal, bijak','duit banyak boleh la beli','sayang duit tu 😂','vokal A confirm ada'],
 solve:['GENIUSSS 🧠','{p} memang terer','aku dah tahu dari awal ok 😤','tepuk tangan semua!!','🎉🎉🎉','legend'],
 wrong:['SALAH 😱','yakin sangat tadi','hampir-hampir','adoi malu kat TV'],
 idle:['cepat la pilih 😴','aku dah tahu jawapan dia','tengok dari kampung ni 👋','salam dari Kuantan!','siapa nak menang malam ni?','abang jojo hensem harini','iklan bila nak habis 😂','mak aku pun tengok ni']
};
function floatE(e,n=8){for(let i=0;i<n;i++)setTimeout(()=>{const d=document.createElement('div');d.className='fl';d.textContent=Array.isArray(e)?rnd(e):e;d.style.left=(5+Math.random()*90)+'%';d.style.setProperty('--dx',(Math.random()*80-40)+'px');$('floaters').appendChild(d);setTimeout(()=>d.remove(),2700)},i*90)}
function sign(t,ic){const s=$('sign');s.innerHTML=(ic?'<img src="sprites/icon_'+ic+'.webp" alt="">':'')+t;s.classList.remove('go');void s.offsetWidth;s.classList.add('go')}
setInterval(()=>{const v=12+Math.random()*4;$('viewers').textContent=v.toFixed(1)+'k';if(phase!=='off'&&Math.random()<.35)chatter('idle',1)},4500);

// ---------- BOARD ----------
function lines(s){const w=s.split(' '),out=[];let l='';for(const x of w){if((l+' '+x).trim().length>13){out.push(l);l=x}else l=(l+' '+x).trim()}out.push(l);return out}
function buildBoard(){const b=$('board');b.innerHTML='';for(const ln of lines(answer)){const r=document.createElement('div');r.className='row';for(const ch of ln){const t=document.createElement('div');if(ch===' ')t.className='tile sp';else{t.className='tile l';t.dataset.c=ch;t.innerHTML='<span>'+ch+'</span>'}r.appendChild(t)}b.appendChild(r)}$('cat').textContent='🏷️ '+cat}
async function reveal(ch){const ts=[...document.querySelectorAll('.tile.l')].filter(t=>t.dataset.c===ch&&!t.classList.contains('show'));for(const t of ts){t.classList.add('flash');tone(1320,.2,'triangle',.15);await sleep(380);t.classList.add('show');t.classList.remove('flash')}return ts.length}
function revealAll(){document.querySelectorAll('.tile.l').forEach(t=>t.classList.add('show'))}
const hidden=()=>[...new Set([...answer.replace(/ /g,'')].filter(c=>!used.has(c)))];
const known=()=>answer.split('').map(c=>c===' '||used.has(c)?c:'_').join('');

// ---------- WHEEL ----------
const cv=$('wheel'),cx=cv.getContext('2d'),N=SEG.length,SA=Math.PI*2/N;
function drawWheel(){const R=225,C=230;cx.clearRect(0,0,460,460);cx.save();cx.translate(C,C);
 cx.beginPath();cx.arc(0,0,R+4,0,7);cx.fillStyle='#ffd166';cx.fill();
 for(let i=0;i<N;i++){const a=rot+i*SA-Math.PI/2,v=SEG[i];cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,R,a,a+SA);cx.closePath();
  cx.fillStyle=v==='MUFLIS'?'#111':v==='HILANG'?'#fff':v==='DURIAN'?'#7cb518':SEGCOL[i%SEGCOL.length];cx.fill();cx.strokeStyle='#ffd166';cx.lineWidth=2;cx.stroke();
  cx.save();cx.rotate(a+SA/2);cx.textAlign='right';cx.textBaseline='middle';cx.fillStyle=v==='HILANG'?'#e5383b':'#fff';
  const lab=v==='DURIAN'?'🍈 DURIAN':v==='HILANG'?'HILANG':v==='MUFLIS'?'MUFLIS':String(v);cx.font=(typeof v==='number'?'bold 26px':'bold 17px')+' "Lilita One",sans-serif';cx.fillText(lab,R-12,0);
  cx.fillStyle='#ffd166';cx.beginPath();cx.arc(R-3,-Math.sin(SA/2)*R*0+0,0,0,0);cx.restore()}
 for(let i=0;i<N;i++){const a=rot+i*SA-Math.PI/2;cx.beginPath();cx.arc(Math.cos(a)*(R-3),Math.sin(a)*(R-3),4,0,7);cx.fillStyle='#fff';cx.fill()}
 cx.beginPath();cx.arc(0,0,38,0,7);cx.fillStyle='#c9184a';cx.fill();cx.strokeStyle='#ffd166';cx.lineWidth=5;cx.stroke();
 cx.fillStyle='#ffd166';cx.font='bold 20px "Lilita One"';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('PT',0,1);cx.restore()}
const segAt=()=>{const m=((-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);return Math.floor(m/SA)%N};
function spinWheel(power=1){return new Promise(res=>{const start=rot,dist=Math.PI*2*(3+power*2+Math.random()*2)+Math.random()*Math.PI*2,dur=3200+power*900,t0=performance.now();let last=segAt();
 function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,4);rot=start+dist*e;drawWheel();const s=segAt();if(s!==last){last=s;sTick()}if(k<1)requestAnimationFrame(f);else res(SEG[segAt()])}requestAnimationFrame(f)})}
// swipe-to-spin
let sw=null;cv.addEventListener('pointerdown',e=>{sw={y:e.clientY,x:e.clientX,t:performance.now()}});
cv.addEventListener('pointerup',e=>{if(!sw)return;const d=Math.hypot(e.clientX-sw.x,e.clientY-sw.y),dt=performance.now()-sw.t;sw=null;if(canAct()&&d>30)doSpin(Math.min(1.6,Math.max(.4,d/dt)))});

// ---------- UI ----------
function renderPods(){$('podiums').innerHTML=P.map((p,i)=>`<div class="pod ${i===cur&&phase!=='off'?'turn':''}"><div class="av"><img src="sprites/${KEYOF(p)}_${p.mood||'idle'}.webp" alt="${p.av}"></div><div class="nm">${p.n}</div><div class="rb">RM${p.rb}</div><div class="tt">Jumlah RM${p.tot}</div></div>`).join('')}
function buildKeys(){$('keys').innerHTML=ALL.split('').map(c=>`<button class="k ${VOW.includes(c)?'v':''}" data-c="${c}">${c}</button>`).join('');
 $('keys').onclick=e=>{const c=e.target.dataset&&e.target.dataset.c;if(c)onKey(c)}}
function refresh(){const me=cur===0,hc=hidden(),cons=hc.some(c=>!VOW.includes(c)),anyCons=[...ALL].some(c=>!VOW.includes(c)&&!used.has(c)),anyVow=[...VOW].some(c=>!used.has(c));
 $('bSpin').disabled=!(me&&phase==='turn'&&anyCons);$('bVowel').disabled=!(me&&phase==='turn'&&anyVow&&P[0].rb>=250);$('bSolve').disabled=!(me&&phase==='turn');
 document.querySelectorAll('.k').forEach(k=>{const c=k.dataset.c,v=VOW.includes(c);k.classList.toggle('used',used.has(c));
  k.disabled=used.has(c)||!me||!((phase==='cons'&&!v)||(phase==='vow'&&v))});renderPods()}
const canAct=()=>cur===0&&phase==='turn'&&[...ALL].some(c=>!VOW.includes(c)&&!used.has(c));

// ---------- FLOW ----------
function pickPuzzle(){let c,a,g=0;do{c=rnd(Object.keys(PUZ));a=rnd(PUZ[c]);g++}while(usedPuz.has(a)&&g<99);usedPuz.add(a);cat=c;answer=a}
async function startRound(){pickPuzzle();used=new Set();P.forEach(p=>p.rb=0);buildBoard();$('rLbl').textContent='PUSINGAN '+round+'/3';phase='wait';refresh();
 sign('PUSINGAN '+round);sClap(1.2,.15);host(round===1?`Selamat datang ke PUSING TEKA! Malam ni kita ada ${P[0].n}, ${P[1].n} dan ${P[2].n}! Kategori: ${cat}!`:`Pusingan ${round}! Kategori kali ni... ${cat}!`);
 chatter('idle',2);await sleep(2200);cur=(round-1)%3;turn()}
async function turn(){phase='turn';P.forEach(p=>p.mood='idle');save();refresh();renderPods();
 if(cur===0){host(rnd([`${P[0].n}, giliran awak! Pusing, beli vokal, atau jawab?`,`Ok ${P[0].n}, apa langkah awak?`,`Penonton tengah tunggu ni ${P[0].n}!`]));}
 else{host(`Giliran ${P[cur].n}!`);await sleep(900);aiTurn()}}
async function nextTurn(msg,m){if(msg)host(msg,m);phase='wait';refresh();await sleep(1500);cur=(cur+1)%3;turn()}

async function doSpin(power=1){if(phase!=='turn')return;phase='spin';refresh();host(rnd(['Pusingggg!','Roda berpusing...','Semoga bertuah!']));chatter('spin',2);
 const v=await spinWheel(power);
 if(v==='MUFLIS'){sBuzz();sAww();sign('MUFLIS!','muflis');mood(cur,'sad');floatE(['😭','💔','😱'],10);chatter('muflis',3);P[cur].rb=0;return nextTurn(`Alamak! MUFLIS! Duit ${P[cur].n} pusingan ni hangus...`,'sad')}
 if(v==='HILANG'){sBuzz();sign('HILANG GILIRAN','hilang');mood(cur,'sad');floatE(['😬','🤦'],6);chatter('lose',2);return nextTurn(`Hilang giliran! Kesian ${P[cur].n}.`,'sad')}
 spinVal=v==='DURIAN'?2000:v;
 if(v==='DURIAN'){sFan();sign('DURIAN RUNTUH!','durian');mood(cur,'happy');floatE(['🍈','🤑','💰'],12);host('DURIAN RUNTUH! RM2000 setiap huruf! Pilih konsonan!','excited')}
 else{if(v>=800){chatter('big',2);floatE(['🤑','💰'],5)}host(`RM${v}! Pilih satu huruf konsonan.`)}
 phase='cons';refresh();if(cur!==0){await sleep(1100);aiPickCons()}}

async function guessLetter(c){used.add(c);const isV=VOW.includes(c);phase='reveal';refresh();host(`Huruf ${c}... ada tak?`);await sleep(900);
 const n=await reveal(c);
 if(n>0){const gain=isV?0:n*spinVal;P[cur].rb+=gain;sDing(1);sClap(n>2?1.6:1,.18);floatE(['👏','🔥','⭐'],3+n);chatter('hit',2);mood(cur,'happy');
  host(isV?`Ada ${n} huruf ${c}!`:`Ada ${n} huruf ${c}! +RM${gain}!`,'excited');refresh();await sleep(1100);
  if(!hidden().length){return solved()}
  phase='turn';refresh();if(cur===0)host(`Bagus! Teruskan ${P[0].n} — pusing lagi, beli vokal, atau jawab?`);else{await sleep(600);aiTurn()}}
 else{sBuzz();chatter('miss',2);floatE(['😅'],3);mood(cur,'sad');return nextTurn(`Maaf, takde huruf ${c}.`,'sad')}}

function onKey(c){if(cur!==0)return;if(phase==='cons'&&!VOW.includes(c))guessLetter(c);else if(phase==='vow'&&VOW.includes(c))guessLetter(c)}
$('bSpin').onclick=()=>canAct()&&doSpin(1);
$('bVowel').onclick=()=>{if(phase!=='turn'||P[0].rb<250)return;P[0].rb-=250;phase='vow';host('Ok, beli vokal RM250. Pilih vokal!');chatter('vowel',1);refresh()};
$('bSolve').onclick=()=>{if(phase!=='turn')return;phase='solving';refresh();$('solveCat').textContent='🏷️ '+cat;$('solveIn').value='';$('mSolve').classList.remove('hide');setTimeout(()=>$('solveIn').focus(),100);host('Wah, berani! Penonton, senyap sekejap...')};
$('bSolveNo').onclick=()=>{$('mSolve').classList.add('hide');phase='turn';refresh()};
$('bSolveOk').onclick=()=>{$('mSolve').classList.add('hide');attempt($('solveIn').value)};
$('solveIn').onkeydown=e=>{if(e.key==='Enter')$('bSolveOk').click()};
const norm=s=>s.toUpperCase().replace(/[^A-Z]/g,'');
async function attempt(g){host(`"${g.toUpperCase()}"... betul ke?`);await sleep(1300);
 if(norm(g)===norm(answer))return solved();
 sBuzz();sign('SALAH!');mood(cur,'sad');chatter('wrong',3);floatE(['😱','🙈'],6);nextTurn(`Salah! Jawapan tu tak tepat.`,'sad')}
async function solved(){phase='wait';revealAll();sFan();sClap(2.4,.3);sign('BETUL!!');floatE(['🎉','👏','🥳','⭐','🎊'],22);chatter('solve',4);
 const w=P[cur],prize=Math.max(w.rb,500);w.tot+=prize;w.mood='happy';host(`BETULLL! "${answer}"! ${w.n} bawa pulang RM${prize}!`,'excited');refresh();await sleep(3600);
 if(round<3){round++;startRound()}else finale()}

// ---------- AI ----------
function aiCandidates(){const k=known();const words=k.split(' ');return Object.values(PUZ).flat().filter(a=>{const w=a.split(' ');if(w.length!==words.length)return false;return w.every((x,i)=>x.length===words[i].length&&[...x].every((c,j)=>words[i][j]==='_'?!used.has(c):words[i][j]===c))})}
async function aiTurn(){if(phase!=='turn')return;const me=P[cur],hc=hidden(),ratio=1-hc.length/new Set(answer.replace(/ /g,'')).size,cands=aiCandidates();
 const skill=me.style==='rawak'?.6:.85;
 if(cands.length===1&&Math.random()<skill||(ratio>.75&&Math.random()<skill*.8)){phase='solving';refresh();host(`${me.n} nak jawab!`);await sleep(1200);
  const g=cands.length===1?cands[0]:(Math.random()<.5?answer:rnd(Object.values(PUZ).flat()));return attempt(g)}
 const vowLeft=[...VOW].filter(c=>!used.has(c)),consLeft=[...ALL].filter(c=>!VOW.includes(c)&&!used.has(c));
 const wantV=vowLeft.length&&me.rb>=250&&(me.style==='vokal'?Math.random()<.65:Math.random()<.3);
 if(wantV||!consLeft.length){if(me.rb>=250&&vowLeft.length){me.rb-=250;phase='vow';refresh();host(`${me.n} beli vokal!`);chatter('vowel',1);await sleep(1100);
  const pick=[...'AIUEO'].find(c=>!used.has(c)&&(Math.random()<.7||true));return guessLetter(pick)}
  phase='solving';return attempt(cands[0]||answer)}
 doSpin(me.style==='berani'?1.4:.9)}
function aiPickCons(){const me=P[cur],cons=[...FREQ].filter(c=>!used.has(c));let pick;
 const smartCands=aiCandidates();if(smartCands.length&&Math.random()<(me.style==='rawak'?.3:.6)){const pool=[...new Set(smartCands.join('').replace(/ /g,''))].filter(c=>!VOW.includes(c)&&!used.has(c));if(pool.length)pick=rnd(pool)}
 if(!pick)pick=Math.random()<(me.style==='rawak'?.5:.2)?rnd(cons):cons[Math.floor(Math.random()*Math.min(4,cons.length))];
 host(`${me.n} pilih huruf ${pick}!`);setTimeout(()=>guessLetter(pick),700)}

// ---------- FINALE / BONUS ----------
function msg(t,p,btns){$('msgT').textContent=t;$('msgP').innerHTML=p;$('msgBtns').innerHTML='';btns.forEach(([l,f,alt])=>{const b=document.createElement('button');b.className='big'+(alt?' alt':'');b.textContent=l;b.onclick=()=>{$('mMsg').classList.add('hide');f()};$('msgBtns').appendChild(b)});$('mMsg').classList.remove('hide')}
async function finale(){clearSave();phase='off';cur=-1;renderPods();const best=[...P].sort((a,b)=>b.tot-a.tot)[0];
 if(best===P[0]){host(`${P[0].n} JUARA malam ni! Masuk ke PUSINGAN BONUS!`);sFan();sClap(2.5,.3);floatE(['🏆','🎉','👑'],20);chatter('solve',3);await sleep(2500);
  msg('🏆 JUARA!',`<img src="sprites/icon_car.webp" style="width:120px" alt=""><br>Tahniah ${P[0].n}! Jumlah RM${P[0].tot}.<br>Sedia untuk <b>PUSINGAN BONUS</b>? Hadiah: <b>KERETA KANCIL COMEL</b>`,[['🎬 JOM!',bonus]])}
 else{host(`${best.n} juara malam ni! Terima kasih ${P[0].n}, jumpa lagi!`);sClap(1.5,.2);chatter('lose',2);
  msg('TAMAT',`Juara: <b>${best.av} ${best.n}</b> (RM${best.tot})<br>Kau: RM${P[0].tot}<br><br>Penonton tetap sayang kau 💕`,[['🔁 MAIN LAGI',restart]])}}
async function bonus(){pickPuzzle();used=new Set([...'RSTLNE']);buildBoard();$('rLbl').textContent='⭐ PUSINGAN BONUS';cur=0;renderPods();
 for(const c of 'RSTLNE')reveal(c);host('Kami beri R, S, T, L, N, E. Pilih 3 konsonan + 1 vokal!');chatter('spin',2);
 phase='bonusPick';let picks=[];const ks=$('keys');
 document.querySelectorAll('.k').forEach(k=>{const c=k.dataset.c;k.classList.toggle('used',used.has(c));k.disabled=used.has(c)});
 ['bSpin','bVowel','bSolve'].forEach(b=>$(b).disabled=true);
 await new Promise(res=>{ks.onclick=e=>{const c=e.target.dataset&&e.target.dataset.c;if(!c||used.has(c))return;const v=VOW.includes(c),nc=picks.filter(x=>!VOW.includes(x)).length,nv=picks.length-nc;
  if((v&&nv>=1)||(!v&&nc>=3))return;picks.push(c);used.add(c);e.target.classList.add('used');e.target.disabled=true;host('Pilihan: '+picks.join(' '));if(picks.length===4)res()}});
 buildKeys();for(const c of picks)await reveal(c);host('10 saat! Jawab sekarang!');
 $('solveCat').innerHTML='🏷️ '+cat+'<br><span id="timer">10</span>';$('solveIn').value='';$('mSolve').classList.remove('hide');$('bSolveNo').style.display='none';$('solveIn').focus();
 let t=10,done=false;const finish=ok=>{if(done)return;done=true;clearInterval(iv);$('mSolve').classList.add('hide');$('bSolveNo').style.display='';$('bSolveOk').onclick=()=>{$('mSolve').classList.add('hide');attempt($('solveIn').value)};revealAll();
  if(ok){sFan();sClap(3,.35);sign('MENANG KERETA!','car');mood(0,'happy');floatE(['🚗','🎉','🏆','💰','🥳'],30);chatter('solve',4);host(`LUAR BIASA! ${P[0].n} MENANG KERETA KANCIL COMEL!`);setTimeout(()=>msg('🚗 MENANG!',`"${answer}"<br>Kau bawa balik kereta + RM${P[0].tot}! 🎉`,[['🔁 MAIN LAGI',restart]]),3000)}
  else{sBuzz();sAww();chatter('wrong',3);host(`Ohh tak sempat! Jawapan: "${answer}". Tapi tetap juara!`);setTimeout(()=>msg('HAMPIR!',`Jawapan: <b>${answer}</b><br>Kau tetap juara dengan RM${P[0].tot} 💪`,[['🔁 MAIN LAGI',restart]]),2500)}};
 const iv=setInterval(()=>{t--;const el=$('timer');if(el)el.textContent=t;sTick();if(t<=0)finish(false)},1000);
 $('bSolveOk').onclick=()=>finish(norm($('solveIn').value)===norm(answer))}
function restart(){clearSave();usedPuz=new Set();round=1;P.forEach(p=>{p.rb=0;p.tot=0});buildKeys();startRound()}

// ---------- SAVE ----------
const SK='pt_save';
function save(){try{localStorage.setItem(SK,JSON.stringify({P,cur,round,answer,cat,used:[...used],usedPuz:[...usedPuz]}))}catch(e){}}
function clearSave(){try{localStorage.removeItem(SK)}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SK));return d&&d.answer&&d.P?d:null}catch(e){return null}}
function resume(d){P=d.P;cur=d.cur;round=d.round;answer=d.answer;cat=d.cat;used=new Set(d.used);usedPuz=new Set(d.usedPuz);
 buildBoard();document.querySelectorAll('.tile.l').forEach(t=>{if(used.has(t.dataset.c))t.classList.add('show')});
 $('rLbl').textContent='PUSINGAN '+round+'/3';buildKeys();sClap(1,.15);sign('KITA KEMBALI!');
 host(`Selamat kembali ke PUSING TEKA! Kita sambung pusingan ${round}, kategori ${cat}.`);comment('yeay dah balik dari iklan 📺');setTimeout(turn,1800)}

// ---------- START ----------
drawWheel();buildKeys();
P=[{n:'KAU',av:'🙋',k:'player',rb:0,tot:0},...[...RIVALS].sort(()=>Math.random()-.5).slice(0,2).map(r=>({...r,rb:0,tot:0}))];renderPods();
try{$('nameIn').value=localStorage.getItem('pt_name')||''}catch(e){}
$('bStart').onclick=()=>{const n=($('nameIn').value.trim()||'KAU').toUpperCase();P[0].n=n;try{localStorage.setItem('pt_name',n)}catch(e){}ac();$('mStart').classList.add('hide');
 clearSave();comment('dah start!! 📺');comment('salam dari Kelantan 👋');startRound()};
(function(){const d=loadSave();if(!d)return;const b=document.createElement('button');b.className='big alt';b.textContent=`▶ SAMBUNG (Pusingan ${d.round}, RM${d.P[0].tot+d.P[0].rb})`;
 b.onclick=()=>{ac();$('mStart').classList.add('hide');resume(d)};$('bStart').before(b);$('bStart').textContent='🎬 MAIN BARU'})();
</script>
</body>
