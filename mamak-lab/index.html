<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#145c57">
<title>Mamak Lab (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#20302e;font-family:Nunito,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;pointer-events:none;align-items:stretch}
.hud2{position:fixed;top:calc(58px + env(safe-area-inset-top));left:8px;display:flex;gap:6px;pointer-events:none}
.lvl{flex:1.4;display:flex;align-items:center;gap:6px;background:#145c57;border:3px solid #0d3f3b;border-radius:16px;padding:3px 10px 3px 4px;box-shadow:0 3px 0 #0a2e2b;min-width:0}
.lvl .star{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;font:15px "Lilita One";color:#7a4c08}
.lvl .star:before{content:"★";position:absolute;font-size:40px;line-height:36px;color:#ffc93c;text-shadow:0 2px 0 #c98a10}
.lvl .star b{position:relative;z-index:1;font-weight:normal;font-size:17px;color:#5a3500;margin-top:3px}
.xp{flex:1;height:12px;background:#0d3f3b;border-radius:8px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(#ffd76a,#f0a030);border-radius:8px;width:0;transition:width .3s}
.navbar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#145c57;border:3px solid #0d3f3b;border-radius:20px;padding:6px 4px;box-shadow:0 4px 0 #0a2e2b;z-index:4}
.navbar button{flex:1;border:0;background:none;color:#cfe9e4;font:12px "Lilita One";display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;border-radius:12px}
.navbar button span{font-size:22px;line-height:24px}
.navbar button.on{background:#f0a030;color:#fff}
.zoom{position:fixed;right:10px;bottom:calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom button{width:46px;height:46px;border-radius:50%;border:3px solid #e8d9bd;background:#fff8ec;color:#145c57;font:20px "Lilita One";box-shadow:0 3px 0 #c9b998}
.pill{background:#145c57;color:#fff;border:3px solid #0d3f3b;border-radius:14px;padding:6px 12px;font:16px "Lilita One",sans-serif;box-shadow:0 3px 0 #0a2e2b}
.pill.light{background:#fff8ec;color:#145c57;border-color:#e8d9bd}
.bbar_old{position:fixed;right:10px;bottom:calc(44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:4}
.bbar button{border:3px solid #0d3f3b;background:#145c57;color:#fff;border-radius:14px;padding:9px 12px;font:15px "Lilita One";box-shadow:0 4px 0 #0a2e2b}
.bbar button.on{background:#f0a030;border-color:#a86a10;box-shadow:0 4px 0 #7a4c08}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;width:min(92vw,380px);background:#fff8ec;border:4px solid #145c57;border-radius:22px;padding:14px;z-index:6;transition:.2s;box-shadow:0 8px 0 #0d3f3b}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet h3{margin:0 0 10px;font:normal 22px "Lilita One";color:#145c57;display:flex;justify-content:space-between}
.sheet h3 button{border:0;background:#e05a5a;color:#fff;border-radius:10px;font:14px "Lilita One";padding:4px 10px}
.sheet .row{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #e8d9bd;border-radius:14px;padding:10px;color:#5a4630}
.sheet .row small{color:#8a7a62}
.sheet .row button{border:0;background:#5cb85c;color:#fff;border-radius:12px;padding:10px 14px;font:15px "Lilita One";box-shadow:0 4px 0 #3b8a3b;white-space:nowrap}
.sheet .row button:disabled{background:#bbb;box-shadow:0 4px 0 #888}
.toast{position:fixed;top:calc(104px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#145c57;color:#fff;padding:8px 14px;border-radius:12px;font:15px "Lilita One";z-index:9;transition:opacity .4s}
.evpill{background:#f0a030;color:#fff;border:3px solid #a86a10;border-radius:12px;padding:4px 10px;font:13px 'Lilita One';display:none;box-shadow:0 3px 0 #7a4c08}
.tag{left:auto!important;right:8px;transform:none!important;top:calc(62px + env(safe-area-inset-top));bottom:auto!important;font-size:10px!important;padding:2px 7px!important;background:#0006!important;max-width:94vw;overflow:hidden;text-overflow:ellipsis;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0009;color:#fff;font-size:11px;padding:5px 10px;border-radius:10px;pointer-events:none;white-space:nowrap}
.cook{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;transform:translateX(-50%) translateY(130%);width:min(94vw,420px);background:#fff8ec;border:4px solid #145c57;border-radius:22px;padding:12px;box-shadow:0 8px 0 #0d3f3b,0 18px 30px #0007;transition:transform .25s;z-index:5}
.cook.on{transform:translateX(-50%) translateY(0)}
.cook h3{margin:0 0 8px;font:normal 20px "Lilita One",sans-serif;color:#145c57;display:flex;justify-content:space-between;align-items:center}
.cook h3 button{border:0;background:#e05a5a;color:#fff;border-radius:10px;font:14px "Lilita One";padding:4px 10px}
.steps{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.steps span{flex:1;min-width:60px;text-align:center;font-size:11px;padding:6px 3px;border-radius:10px;background:#eadfcb;color:#8a7a62}
.steps span.now{background:#ffd76a;color:#5a3d00;outline:3px solid #f0a030;animation:pulse .8s infinite alternate}
.steps span.done{background:#5cb85c;color:#fff}
@keyframes pulse{to{transform:scale(1.06)}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{border:0;background:#fff;border:3px solid #e8d9bd;border-radius:14px;padding:10px 4px;font:13px Nunito;font-weight:800;color:#5a4630;box-shadow:0 4px 0 #e8d9bd}
.opts button:active{transform:translateY(3px);box-shadow:none}
.opts button.bad{animation:shake .3s;border-color:#e05a5a}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tarik{display:none;margin-top:4px}.tarik.on{display:block}
.bar{position:relative;height:26px;background:#eadfcb;border-radius:13px;overflow:hidden;margin-bottom:8px}
.zone{position:absolute;top:0;bottom:0;background:#5cb85c88}
.needle{position:absolute;top:-2px;bottom:-2px;width:6px;background:#145c57;border-radius:3px}
.tarik button{width:100%;border:0;background:#c8102e;color:#fff;border-radius:14px;padding:12px;font:18px "Lilita One";box-shadow:0 4px 0 #7a0a1c}
.timer{font:14px Nunito;font-weight:800;color:#8a7a62}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="lvl"><div class="star"><b id="lv">1</b></div><div class="xp"><i id="xpb"></i></div></div><div class="pill" id="money">RM 0.00</div><div class="pill light" id="rate">♥ 5.0</div></div>
<div class="hud2"><div class="pill light" id="clock">6:00 am</div><div class="evpill" id="ev"></div></div>
<div class="zoom"><button id="zIn">＋</button><button id="zOut">－</button><button id="zC">◎</button></div>
<div class="navbar"><button id="bBuild"><span>🔨</span>Build</button><button id="bStaff"><span>🧑‍🍳</span>Staff</button><button id="bUp"><span>🛠️</span>Upgrade</button><button id="bReg"><span>👥</span>Regular</button></div>
<div class="sheet" id="staff"><h3>🧑‍🍳 Staff <button id="stX">✕</button></h3>
<div class="row"><div><b>Pelayan</b><br><small>Auto-masak & hantar order customer yang dah tunggu. Kualiti biasa (tiada tip).</small><br><small id="wCount"></small></div><button id="hireW">Hire</button></div>
<p style="font-size:11px;color:#8a7a62;margin:8px 0 0">Kau masak sendiri = dapat tip ⭐. Pelayan = kurang pressure.</p></div>
<div class="sheet" id="regs"><h3>👥 Pelanggan Tetap <button id="rgX">✕</button></h3><div id="regList" style="display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto"></div></div>
<div class="sheet" id="upg"><h3>🛠️ Upgrade <button id="upX">✕</button></h3><div id="upList" style="display:flex;flex-direction:column;gap:8px"></div></div>
<div class="tag">v0.6.3</div>
<div class="cook" id="cook"><h3><span id="ckTitle">Roti Canai</span><span class="timer" id="ckTime">0.0s</span><button id="ckX">✕</button></h3><div class="steps" id="ckSteps"></div><canvas id="rc" width="720" height="380" style="display:none;width:100%;height:190px;border-radius:14px;background:#3a2a22;touch-action:none"></canvas><div id="rcHint" style="display:none;text-align:center;font-size:12px;color:#8a7a62;margin-top:6px"></div><div class="opts" id="ckOpts"></div><div class="tarik" id="ckTarik"><div class="bar"><div class="zone" id="ckZone"></div><div class="needle" id="ckNeedle"></div></div><button id="ckTarikBtn">TARIK! 〰️</button></div></div>
<script>
// ===== Mamak Lab v0.1 — prototaip isometric (belum link ke Mamak Rush) =====
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}addEventListener('resize',resize);resize();

const TW=64,TH=32; // saiz jubin isometric 2:1
const GX=10,GY=8;  // saiz kedai
let cam={x:0,y:-40,z:Math.min(1.6,Math.max(.7,innerWidth/470))};
function iso(gx,gy,h=0){return{x:(gx-gy)*TW/2,y:(gx+gy)*TH/2-h}}

// ---------- simpan ----------
let lv=1,xp=0,seen={};let money=0,ownTables=2,nWaiters=0,UP={tawa:0,teko:0,kipas:0,tv:0,pokok:0};
try{const d=JSON.parse(localStorage.getItem('mamakLab')||'{}');money=d.money||+localStorage.getItem('mamakLabMoney')||0;ownTables=d.tables||2;nWaiters=d.waiters||0;Object.assign(UP,d.up||{});lv=d.lv||1;xp=d.xp||0;seen=d.seen||{}}catch(e){}
function save(){try{localStorage.setItem('mamakLab',JSON.stringify({money,tables:ownTables,waiters:nWaiters,up:UP,lv,xp,seen}))}catch(e){}}

// ---------- susun atur kedai ----------
// 8 slot meja; mula dengan 2, beli lagi dalam mod Build
const SLOTS=[{x:2,y:4.2},{x:7,y:4.2},{x:2,y:2.6},{x:7,y:2.6},{x:2,y:5.8},{x:7,y:5.8},{x:2,y:7.2},{x:7,y:7.2}];
const TABLE_COST=[0,0,20,30,45,60,80,100];
const TABLES=[],SEATS=[];
function addTable(){const t=SLOTS[TABLES.length];const i=TABLES.length;TABLES.push(t);SEATS.push({x:t.x-.85,y:t.y,t:i,who:null},{x:t.x+.85,y:t.y,t:i,who:null})}
for(let i=0;i<ownTables;i++)addTable();
// staff
const WAITER_COST=[25,50,90];const waiters=[];
function addWaiter(){const i=waiters.length;waiters.push({id:'pelayan'+(i+1),x:4+i,y:1.75,home:{x:4+i,y:1.75},st:'idle',path:[],t:0,shirt:'#145c57',skin:SKIN[(i+2)%SKIN.length],cap:false,target:null})}
const MENU=[
 {n:'Roti Canai',e:'🫓',p:2.5,r:['🌀 Tebar','👉 Ke tawa','🔄 Terbalik','🍽️ Hidang'],visual:'roti'},
 {n:'Teh Tarik',e:'☕',p:2.2,r:['✋ Tahan','⬆️ Tarik tinggi','🎯 Lepas kat garisan'],visual:'teh'},
 {n:'Maggi Goreng',e:'🍜',p:6.5,r:['🍜 Rebus maggi','🥚 Pecah telur','🌶️ Sos cili','🔥 Goreng']},
 {n:'Nasi Lemak',e:'🍛',p:5,r:['🍚 Nasi','🥜 Kacang','🥒 Timun','🌶️ Sambal']},
 {n:'Milo Ais',e:'🧋',p:3,r:['🍫 Milo','🥛 Susu','🧊 Ais','🥄 Kacau']}];
const ALL_STEPS=[...new Set(MENU.filter(m=>!m.visual).flatMap(m=>m.r).filter(x=>x!=='〰️ TARIK'))];
const SKIN=['#8a5a3c','#c68a5e','#e8b48a','#6b4128','#f1c9a0'],SHIRT=['#3b7dd8','#e05a5a','#5cb85c','#f0a030','#8a5cd8','#2aa198','#eee'];
for(let i=0;i<nWaiters;i++)addWaiter();

// ---------- watak ----------
// Pelanggan tetap (sama nama dengan Mamak Rush). Order tetap dipapar dalam bubble — tak perlu hafal.
const REG=[
 {id:'jamal',nm:'Abang Jamal',shirt:'#d62828',skin:'#c68a5e',cap:false,fav:1,pat:.8,tip:1,h:[17,24],line:'Teh satu boss! Malam ni Harimau main!',bola:true},
 {id:'lina',nm:'Kak Lina',shirt:'#f4a6c0',skin:'#e8b48a',cap:false,tud:'#f4a6c0',fav:3,pat:.9,tip:1,h:[7,14],line:'Cepat sikit ya, kejap lagi meeting'},
 {id:'rahman',nm:'Pakcik Rahman',shirt:'#8a5cd8',skin:'#c68a5e',cap:false,kopiah:true,fav:0,pat:1.6,tip:0,h:[6,11],line:'Takpe, pakcik tak kejar masa'},
 {id:'amir',nm:'Adik Amir',shirt:'#ffffff',skin:'#c68a5e',cap:false,fav:4,pat:1,tip:0,h:[13,18],line:'Milo ais! Baru habis sekolah'},
 {id:'lim',nm:'Uncle Lim',shirt:'#eeeeee',skin:'#f1c9a0',cap:false,fav:1,pat:1.3,tip:1,h:[6,12],line:'Boss, teh kurang manis ah'},
 {id:'devi',nm:'Aunty Devi',shirt:'#f0a030',skin:'#8a5a3c',cap:false,fav:0,pat:1.1,tip:1,h:[9,20],line:'Roti kosong satu, garing ya'},
 {id:'raju',nm:'Abang Raju',shirt:'#ff7f2a',skin:'#6b4128',cap:true,capc:'#ffd400',fav:2,pat:.9,tip:1,h:[12,15],line:'Lapar gila, baru habis site'},
 {id:'kiah',nm:'Makcik Kiah',shirt:'#5cb85c',skin:'#e8b48a',cap:false,tud:'#e86ab8',fav:3,pat:1.2,tip:0,h:[7,12],line:'Makcik baru balik pasar'}];
const people=[],floaters=[];
function pickOrder(){const w=MENU.map(m=>m.n==='Teh Tarik'&&(EV.id==='bola'||EV.id==='hujan')?3:m.n==='Maggi Goreng'&&EV.id==='bola'?2.5:1);let r=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return MENU[i]}return MENU[0]}
function spawn(){
  const hr=gameMin/60;const here=new Set(people.map(p=>p.reg&&p.reg.id));
  const regs=REG.filter(r=>!here.has(r.id)&&hr>=r.h[0]&&hr<r.h[1]&&(!r.bola||EV.id==='bola'||Math.random()<.3));
  const reg=regs.length&&Math.random()<.4?regs[Math.random()*regs.length|0]:null;
  const seat=SEATS.filter(s=>!s.who);if(!seat.length)return;
  const s=seat[Math.random()*seat.length|0];
  const p={x:13,y:8.6,path:[{x:5,y:8.6},{x:5,y:s.y},{x:s.x,y:s.y}],seat:s,st:'walk',t:0,
    skin:SKIN[Math.random()*SKIN.length|0],shirt:SHIRT[Math.random()*SHIRT.length|0],cap:Math.random()<.4,
    order:pickOrder(),pat:1,reg,v:Math.random()*5|0};
  if(reg){Object.assign(p,{skin:reg.skin,shirt:reg.shirt,cap:reg.cap,capc:reg.capc,tud:reg.tud,kopiah:reg.kopiah,order:MENU[reg.fav]})}
  s.who=p;people.push(p);
}
const cooks=[{id:'chef1',x:3,y:0.3,c:'#fff',ph:0},{id:'chef2',x:6.4,y:0.3,c:'#fff',ph:2.3}];

function update(dt){
  for(const p of [...people]){
    if(p.st==='walk'||p.st==='leave'){
      const w=p.path[0];if(!w){if(p.st==='walk'){p.st='wait';p.t=0;if(p.reg)floaters.push({x:p.x,y:p.y,txt:'💬 '+p.reg.line,t:0,small:1,life:3})}else{people.splice(people.indexOf(p),1)}continue}
      const dx=w.x-p.x,dy=w.y-p.y,d=Math.hypot(dx,dy),sp=2.2*dt;
      if(d>.001){p.fx=dx;p.fy=dy}if(d<sp){p.x=w.x;p.y=w.y;p.path.shift()}else{p.x+=dx/d*sp;p.y+=dy/d*sp}
      p.t+=dt;
    }else if(p.st==='wait'){if(p.serving)continue;p.t+=dt;p.pat=Math.max(0,1-p.t/(45*(p.reg?p.reg.pat:1)*(1+.25*UP.kipas)*(EV.id==='hujan'?1.3:1)));if(p.pat<=0){leave(p,false)}}
    else if(p.st==='eat'){p.t+=dt;if(p.t>6){pay(p);leave(p,true)}}
  }
  for(const w of waiters){
    if(w.st==='idle'){const c=people.find(p=>p.st==='wait'&&!p.serving&&p.t>2.5);if(c){c.serving=true;c.byWaiter=true;w.target=c;w.st='prep';w.t=0}}
    else if(w.st==='prep'){w.t+=dt;if(w.t>3.5*(1-.15*UP.tawa)){const s=w.target.seat;w.path=[{x:5,y:2},{x:5,y:s.y-.7},{x:s.x,y:s.y-.7}];w.st='go'}}
    else if(w.st==='go'||w.st==='back'){const p=w.path[0];
      if(!p){if(w.st==='go'){const c=w.target;if(c&&c.st==='wait'){c.serving=false;c.st='eat';c.t=0;c.q=0;floaters.push({x:c.x,y:c.y,txt:'🧑‍🍳 Siap!',t:0})}
          w.target=null;w.path=[{x:5,y:w.y},{x:5,y:2},w.home];w.st='back'}else w.st='idle';continue}
      const dx=p.x-w.x,dy=p.y-w.y,d=Math.hypot(dx,dy),sp=2.6*dt;if(d>.001){w.fx=dx;w.fy=dy}if(d<sp){w.x=p.x;w.y=p.y;w.path.shift()}else{w.x+=dx/d*sp;w.y+=dy/d*sp}w.t+=dt}
  }
  for(const f of [...floaters]){f.t+=dt;if(f.t>(f.life||1.4))floaters.splice(floaters.indexOf(f),1)}
}
let ratings=[5];
function leave(p,happy){waiters.forEach(w=>{if(w.target===p){w.target=null;w.path=[w.home];w.st='back'}});p.st='leave';p.seat.who=null;p.path=[{x:5,y:p.y},{x:5,y:8.6},{x:-4,y:8.6}];
  ratings.push(happy?Math.min(5,(p.pat>.5?4:3)+(p.q>=1||UP.pokok?1:0)):1);if(ratings.length>20)ratings.shift();
  if(!happy)floaters.push({x:p.x,y:p.y,txt:'😠',t:0})}
function needXp(){return 8+lv*4}
function gainXp(n){xp+=n;while(xp>=needXp()){xp-=needXp();lv++;const b=5*lv;money+=b;setTimeout(()=>toast('⭐ Naik Level '+lv+'! Bonus RM'+b),200);beep(990)}}
function pay(p){gainXp(1+(p.q>=1?1:0));if(p.reg){seen[p.reg.id]=(seen[p.reg.id]||0)+1}let tip=(p.pat>.6?1:0)+(p.q||0)+(p.reg&&p.q>=1?p.reg.tip:0)+(EV.id==='bola'&&UP.tv&&evOn()?1:0);if(EV.id==='gaji')tip*=2;const amt=p.order.p+tip;money+=amt;save();floaters.push({x:p.x,y:p.y,txt:'+RM'+amt.toFixed(2),t:0})}

// ---------- jam & siang/malam ----------
let gameMin=6*60;const MIN_PER_SEC=6; // 1 hari = 4 minit sebenar
function darkness(){const h=gameMin/60%24;if(h>=7&&h<18)return 0;if(h>=20||h<5)return .55;if(h>=18)return (h-18)/2*.55;return (7-h)/2*.55}

// ---------- sprite (ganti lukisan placeholder bila art masuk) ----------
const SPR={};fetch('sprites/list.json').then(r=>r.ok?r.json():[]).catch(()=>[]).then(l=>l.forEach(n=>{const i=new Image();i.onload=()=>SPR[n]=i;i.src='sprites/'+n+'.webp'}));
function spr(k){return SPR[k]}
function drawSpr(k,x,y,w){const i=SPR[k];const h=w*i.height/i.width;cx.drawImage(i,x-w/2,y-h,w,h)}
// gambar rata (pandang depan) dicondongkan ikut dinding. dir=+1 dinding belakang-kanan (paksi gx), -1 dinding kiri (paksi gy)
function onWall(dir,ax,ay,fn){cx.save();cx.translate(ax,ay);cx.transform(1,dir*.5,0,1,0,0);fn();cx.restore()}
function wallTiles(k,dir,ax,ay,len,h,ts){onWall(dir,ax,ay,()=>{cx.beginPath();cx.rect(0,-h,len,h);cx.clip();const i=SPR[k];for(let u=0;u<len;u+=ts)for(let v=0;v<h;v+=ts)cx.drawImage(i,u,-v-ts,ts,ts)})}
function wallImg(k,dir,ax,ay,u,hb,w){const i=SPR[k];const h=w*i.height/i.width;onWall(dir,ax,ay,()=>cx.drawImage(i,u-w/2,-hb-h,w,h))}
function personSprite(p,cook,k){const sit=p.st==='wait'||p.st==='eat';const s=iso(p.x+.5,p.y+.5);const bob=(!sit&&!cook)?Math.abs(Math.sin(p.t*9))*2:0;

function poly(pts,fill,stroke){cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));cx.closePath();cx.fillStyle=fill;cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=1;cx.stroke()}}
function tile(gx,gy,c,s){poly([iso(gx,gy),iso(gx+1,gy),iso(gx+1,gy+1),iso(gx,gy+1)],c,s)}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.min(255,r*k|0);g=Math.min(255,g*k|0);b=Math.min(255,b*k|0);return`rgb(${r},${g},${b})`}
function box(x,y,w,d,h,c,z=0){ // kotak isometric
  const A=iso(x,y+d,z),B=iso(x+w,y+d,z),C=iso(x+w,y,z),T=(px,py)=>iso(px,py,z+h);
  poly([A,B,T(x+w,y+d),T(x,y+d)],shade(c,.82));
  poly([B,C,T(x+w,y),T(x+w,y+d)],shade(c,.65));
  poly([T(x,y),T(x+w,y),T(x+w,y+d),T(x,y+d)],c);
}

function personSheet(p,cook,i){let s=iso(p.x+.5,p.y+.5);const now=performance.now()/1000;
  const sit=p.st==='wait'||p.st==='eat',walk=p.st==='walk'||p.st==='leave';
  if(!sit){cx.fillStyle='#0003';cx.beginPath();cx.ellipse(s.x,s.y,10,4,0,0,7);cx.fill()}
  let col=0,row=0,flip=false,y=s.y,w=48;
  if(sit){const t=TABLES[p.seat.t];const left=p.seat.x<t.x;row=left?0:1;col=3;flip=left;s={x:s.x+(left?BUTT_F:-BUTT_B),y:s.y}}
  else if(walk){const fx=p.fx||0,fy=p.fy||0,sx=fx-fy,sy=fx+fy;row=sy>=0?0:1;flip=sx>0;p._f=flip;p._r=row;const fr=Math.floor(p.t*7)%4;col=[1,0,2,0][fr]}

function tap(sx,sy){if(ck)return;

  let best=null,bd=1e9;for(const p of people){if(p.st!=='wait'||p.serving)continue;const s=iso(p.x+.5,p.y+.5);
    // kawasan tap besar: dari kaki sampai bubble
    const dx=Math.abs(s.x-wx),top=s.y-90,bot=s.y+8;if(dx<28&&wy>top&&wy<bot){const d=dx+Math.abs(s.y-45-wy);if(d<bd){bd=d;best=p}}}
  if(best&&!ck)openCook(best)
}


// ---------- mini masak ----------
let ck=null;const $=id=>document.getElementById(id);
function openCook(p){p.serving=true;ck={p,i:0,t:0,miss:0,tarik:null};const m=p.order;$('ckTitle').textContent=m.e+' '+m.n;if(m.visual==='roti'){$('ckTarik').classList.remove('on');renderSteps();rotiStart()}else if(m.visual==='teh'){$('ckTarik').classList.remove('on');renderSteps();tehStart()}else renderCook();$('cook').classList.add('on')}
function renderCook(){const m=ck.p.order;
  $('ckSteps').innerHTML=m.r.map((x,i)=>`<span class="${i<ck.i?'done':i===ck.i?'now':''}">${x}</span>`).join('');
  const need=m.r[ck.i];
  if(need==='〰️ TARIK'){$('ckOpts').innerHTML='';$('ckTarik').classList.add('on');ck.tarik={x:0,v:1,z:20+Math.random()*50,w:22};$('ckZone').style.left=ck.tarik.z+'%';$('ckZone').style.width=ck.tarik.w+'%';return}
  $('ckTarik').classList.remove('on');
  const decoy=ALL_STEPS.filter(x=>!m.r.includes(x)).sort(()=>Math.random()-.5).slice(0,6-m.r.length+ (m.r.includes('〰️ TARIK')?1:0));
  const opts=[...m.r.filter(x=>x!=='〰️ TARIK'),...decoy].sort(()=>Math.random()-.5);
  $('ckOpts').innerHTML=opts.map(x=>`<button>${x}</button>`).join('');
  [...$('ckOpts').children].forEach(b=>b.onclick=()=>pick(b))}
function pick(b){const need=ck.p.order.r[ck.i];
  if(b.textContent===need){ck.i++;beep(660);next()}else{ck.miss++;ck.t+=1.5;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');beep(180)}}
function next(){if(ck.i>=ck.p.order.r.length)return done();renderCook()}
$('ckTarikBtn').onclick=()=>{const t=ck.tarik;if(!t)return;
  if(t.x>=t.z&&t.x<=t.z+t.w){ck.tarik=null;ck.i++;beep(880);next()}else{ck.miss++;ck.t+=1.5;beep(180)}};
function done(){const p=ck.p;
  let q=ck.t<4&&ck.miss===0?2:ck.t<7&&ck.miss<2?1:0; // bonus tip
  if(ck.forceQ!=null)q=ck.forceQ;
  p.q=q;p.serving=false;p.st='eat';p.t=0;
  floaters.push({x:p.x,y:p.y,txt:ck.burnt==='tumpah'?'💦 Tumpah!':ck.burnt?'🔥 Hangus!':['👍 OK','⭐ Sedap!','🌟 Power!'][q],t:0});if(ck.burnt)p.pat=Math.min(p.pat,.3);
  closeCook()}
function closeCook(){if(R)rotiStop();if(T){tehStop();rotiStopUI()}if(ck&&ck.p.st==='wait')ck.p.serving=false;ck=null;$('cook').classList.remove('on')}
$('ckX').onclick=closeCook;
function cookTick(dt){if(!ck)return;ck.t+=dt;$('ckTime').textContent=ck.t.toFixed(1)+'s';
  const t=ck.tarik;if(t){t.x+=t.v*dt*110;if(t.x>=100){t.x=100;t.v=-1}if(t.x<=0){t.x=0;t.v=1}$('ckNeedle').style.left='calc('+t.x+'% - 3px)'}}
let AC=null;function beep(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.15);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}

// ---------- event harian ----------
const EVENTS={
 none:{n:''},
 bola:{n:'⚽ Malam Bola',d:'Harimau Malaya main malam ni! Ramai datang 8pm–12am',h:[20,24],busy:.5},
 hujan:{n:'🌧️ Hujan Lebat',d:'Hujan petang 2pm–7pm. Kurang orang, tapi lagi sabar. Ramai order teh!',h:[14,19],busy:1.6},
 gaji:{n:'💰 Hari Gaji',d:'Gaji masuk! Tip customer x2 sepanjang hari',h:[0,24],busy:.9}};
let EV={id:'none'};
function newDay(){const r=Math.random();const id=r<.25?'bola':r<.45?'hujan':r<.55?'gaji':'none';EV={id,...EVENTS[id]};if(id!=='none')setTimeout(()=>toast('Hari ini: '+EV.n),400)}
function evOn(){if(EV.id==='none')return false;const h=gameMin/60;return h>=EV.h[0]&&h<EV.h[1]}

// ---------- stesen Roti Canai (visual) ----------
const rc=$('rc'),rx=rc.getContext('2d');let R=null;
function rotiStart(){R={ph:'tebar',spin:0,last:null,dx:0,dy:0,drag:false,c:[0,0],side:0,r:22};rc.style.display='block';$('ckOpts').style.display='none';hint('🌀 Pusing jari bulat-bulat atas doh untuk tebar!')}
function rotiStop(){R=null;rc.style.display='none';$('rcHint').style.display='none';$('ckOpts').style.display=''}
function hint(t){$('rcHint').style.display='block';$('rcHint').textContent=t}
function rcPos(e){const b=rc.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*360,y:(e.clientY-b.top)/b.height*190}}
const DOH={x:90,y:95},TAWA={x:255,y:95};
rc.addEventListener('pointerdown',e=>{if(!R)return;rc.setPointerCapture(e.pointerId);const p=rcPos(e);R.last=p;
  if(R.ph==='drag'&&Math.hypot(p.x-DOH.x,p.y-DOH.y)<70){R.drag=true}
  if(R.ph==='cook'){const d=Math.hypot(p.x-TAWA.x,p.y-TAWA.y);if(d<80)flipRoti()}});
rc.addEventListener('pointermove',e=>{if(!R||!R.last)return;const p=rcPos(e);
  if(R.ph==='tebar'&&Math.hypot(p.x-DOH.x,p.y-DOH.y)<90){R.spin+=Math.hypot(p.x-R.last.x,p.y-R.last.y);R.r=22+Math.min(48,R.spin/25);if(R.spin>1200){R.ph='drag';ck.i=1;renderSteps();beep(660);hint('👉 Seret roti ke atas tawa')}}
  if(R.ph==='drag'&&R.drag){R.dx=p.x-DOH.x;R.dy=p.y-DOH.y}
  R.last=p});
rc.addEventListener('pointerup',()=>{if(!R)return;R.last=null;
  if(R.ph==='drag'&&R.drag){R.drag=false;if(Math.hypot(DOH.x+R.dx-TAWA.x,DOH.y+R.dy-TAWA.y)<60){R.ph='cook';ck.i=2;renderSteps();beep(660);hint('🔥 Tunggu jadi keemasan, tap untuk terbalik!')}else{R.dx=R.dy=0}}});
function flipRoti(){beep(520);if(R.side===0){R.side=1;hint('🔥 Sebelah lagi! Tap bila keemasan untuk hidang');ck.i=3;renderSteps()}else{R.ph='done';ck.i=4;
  const good=R.c.filter(c=>c>.7&&c<1.05).length,burnt=R.c.some(c=>c>1.3);ck.forceQ=burnt?0:good;if(burnt)ck.burnt=true;rotiStop();done()}}
function rotiTick(dt){if(!R)return;if(R.ph==='cook')R.c[R.side]+=dt/3.2*(1+.35*UP.tawa);
  rx.setTransform(2,0,0,2,0,0);rx.clearRect(0,0,360,190);
  // tawa
  rx.fillStyle='#222';rx.beginPath();rx.ellipse(TAWA.x,TAWA.y+8,92,62,0,0,7);rx.fill();rx.fillStyle='#555';rx.beginPath();rx.ellipse(TAWA.x,TAWA.y,88,58,0,0,7);rx.fill();
  rx.fillStyle='#ffb04080';rx.beginPath();rx.ellipse(TAWA.x,TAWA.y,70,44,0,0,7);rx.fill();
  // papan doh
  rx.fillStyle='#b98a5a';rx.beginPath();rx.roundRect(15,25,150,140,14);rx.fill();
  // roti
  let x=DOH.x+R.dx,y=DOH.y+R.dy,r=R.r;if(R.ph==='cook'){x=TAWA.x;y=TAWA.y}
  const c=R.ph==='cook'?R.c[R.side]:0;
  const col=c<.7?[250-c*20,236-c*60,200-c*120]:c<1.05?[235,180-(c-.7)*100,80]:[120-(c-1.05)*150,70,30];
  rx.fillStyle=`rgb(${col.map(v=>Math.max(30,v|0))})`;rx.beginPath();rx.ellipse(x,y,r,r*.65,0,0,7);rx.fill();
  rx.strokeStyle='#0002';rx.lineWidth=2;for(let k=1;k<4;k++){rx.beginPath();rx.ellipse(x,y,r*k/4,r*.65*k/4,R.spin/200,0,5);rx.stroke()}
  if(R.ph==='tebar'){rx.strokeStyle='#fff8';rx.setLineDash([6,6]);rx.beginPath();rx.arc(DOH.x,DOH.y,60,0,7);rx.stroke();rx.setLineDash([]);
    rx.fillStyle='#fff';rx.fillRect(25,170,130*Math.min(1,R.spin/1200),8)}
  if(R.ph==='cook'){ // meter masak
    const mx=200,my=170,mw=120;rx.fillStyle='#ddd';rx.fillRect(mx,my,mw,10);rx.fillStyle='#5cb85c';rx.fillRect(mx+mw*.7/1.4,my,mw*.35/1.4,10);
    rx.fillStyle='#e05a5a';rx.fillRect(mx+mw*1.3/1.4,my,mw*.1/1.4,10);rx.fillStyle='#fff';rx.fillRect(mx+mw*Math.min(1,c/1.4)-2,my-3,4,16);
    if(c>1.05){rx.fillStyle='#888a';for(let k=0;k<3;k++){rx.beginPath();rx.arc(x-20+k*20,y-30-(performance.now()/20+k*30)%40,8,0,7);rx.fill()}}
    if(c>1.4){R.c[R.side]=1.4;ck.forceQ=0;ck.burnt=true;R.ph='done';rotiStop();done()}}
}
function renderSteps(){const m=ck.p.order;$('ckSteps').innerHTML=m.r.map((x,i)=>`<span class="${i<ck.i?'done':i===ck.i?'now':''}">${x}</span>`).join('')}

// ---------- stesen Teh Tarik (visual) ----------
let T=null;
function tehZone(){const w=.14+.06*UP.teko;return[.73-w/2,.73+w/2]}
function tehStart(){T={lvl:0,foam:0,h:0,down:false,y0:0,spill:0,drops:[]};rc.style.display='block';$('ckOpts').style.display='none';hint('✋ Tahan jari, tarik ke ATAS untuk tarik teh tinggi. Lepas bila sampai garisan hijau!')}
function tehStop(){T=null}
rc.addEventListener('pointerdown',e=>{if(!T)return;rc.setPointerCapture(e.pointerId);T.down=true;T.y0=rcPos(e).y+T.h;if(ck.i<1){ck.i=1;renderSteps()}});
rc.addEventListener('pointermove',e=>{if(!T||!T.down)return;T.h=Math.max(0,Math.min(120,T.y0-rcPos(e).y))});
rc.addEventListener('pointerup',()=>{if(!T)return;T.down=false;if(T.lvl>=.3)tehFinish()});
function tehFinish(over){const[a,b]=tehZone();const inz=T.lvl>=a&&T.lvl<=b;
  ck.forceQ=over?0:inz?(T.foam>.55?2:1):0;if(over||T.lvl>b+.08)ck.burnt='tumpah';beep(inz?880:300);ck.i=3;rotiStopUI();T=null;done()}
function rotiStopUI(){rc.style.display='none';$('rcHint').style.display='none';$('ckOpts').style.display=''}
function tehTick(dt){if(!T)return;
  if(T.down){const hn=T.h/120;T.lvl+=dt*(.16+.08*hn);T.foam=Math.min(1,T.foam+dt*hn*.55);
    if(hn>.85){T.spill+=dt;T.lvl-=dt*.05;if(Math.random()<.5)T.drops.push({x:250+(Math.random()-.5)*40,y:120,vx:(Math.random()-.5)*60,vy:-40,t:0})}
    if(T.lvl>.3&&ck.i<2){ck.i=2;renderSteps()}}
  else T.h=Math.max(0,T.h-dt*200);
  if(T.lvl>=1){T.lvl=1;return tehFinish(true)}
  rx.setTransform(2,0,0,2,0,0);rx.clearRect(0,0,360,190);
  const[a,b]=tehZone();const gx=250,gy=178,gw=46,gh=78; // gelas
  // garisan tinggi bahaya
  rx.fillStyle='#e05a5a33';rx.fillRect(170,0,170,22);rx.fillStyle='#fff8';rx.font='10px Nunito';rx.fillText('⚠️ terlalu tinggi = tumpah',178,14);
  // teko atas
  const ty=110-T.h*.85;rx.fillStyle='#cfd4d8';rx.beginPath();rx.roundRect(gx-20,ty-34,40,34,6);rx.fill();rx.fillStyle='#9aa2a8';rx.fillRect(gx+20,ty-28,8,18);
  // aliran
  if(T.down){rx.strokeStyle='#c98a4b';rx.lineWidth=5;rx.beginPath();rx.moveTo(gx-14,ty);rx.quadraticCurveTo(gx-6,(ty+gy-gh)/2,gx,gy-gh*T.lvl-4);rx.stroke()}
  // gelas
  rx.fillStyle='#ffffff22';rx.fillRect(gx-gw/2,gy-gh,gw,gh);rx.strokeStyle='#fff';rx.lineWidth=2;rx.strokeRect(gx-gw/2,gy-gh,gw,gh);
  const lh=gh*Math.min(1,T.lvl);rx.fillStyle='#b9773d';rx.fillRect(gx-gw/2+2,gy-lh,gw-4,lh);
  const fh=Math.min(lh,4+T.foam*16);rx.fillStyle='#f3e2c4';rx.fillRect(gx-gw/2+2,gy-lh,gw-4,fh);
  // zon sasaran
  rx.strokeStyle='#5cb85c';rx.lineWidth=3;[a,b].forEach(v=>{rx.beginPath();rx.moveTo(gx-gw/2-8,gy-gh*v);rx.lineTo(gx+gw/2+8,gy-gh*v);rx.stroke()});
  rx.fillStyle='#5cb85c44';rx.fillRect(gx-gw/2-8,gy-gh*b,gw+16,gh*(b-a));
  // titisan tumpah
  rx.fillStyle='#c98a4b';T.drops=T.drops.filter(d=>(d.t+=dt)<.8);T.drops.forEach(d=>{d.vy+=300*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;rx.beginPath();rx.arc(d.x,d.y,3,0,7);rx.fill()});
  // meter buih & tinggi (kiri)
  rx.fillStyle='#fff';rx.font='12px "Lilita One"';rx.fillText('Buih',30,30);rx.fillStyle='#ffffff33';rx.fillRect(30,38,18,130);rx.fillStyle='#f3e2c4';rx.fillRect(30,168-130*T.foam,18,130*T.foam);
  rx.fillStyle='#fff';rx.fillText('Tinggi',80,30);rx.fillStyle='#ffffff33';rx.fillRect(84,38,18,130);const hn=T.h/120;rx.fillStyle=hn>.85?'#e05a5a':hn>.5?'#5cb85c':'#f0a030';rx.fillRect(84,168-130*hn,18,130*hn);
  rx.fillStyle='#fff';rx.font='11px Nunito';rx.fillText(T.down?'Teruskan… ☕':'Tahan & tarik ⬆️',120,100)}

// ---------- loop ----------
let last=performance.now(),spawnT=1;const MAXQ=3; // maksimum customer menunggu serentak
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  const pm=gameMin;gameMin=(gameMin+dt*MIN_PER_SEC)%(24*60);if(pm<360&&gameMin>=360)newDay();
  const h=gameMin/60;const busy=(h>=7&&h<10)||(h>=12&&h<14)||(h>=20||h<1)?.6:1.6;const busyEv=busy*(evOn()?EV.busy:1)*(UP.pokok?.9:1);
  spawnT-=dt;if(spawnT<=0){const waiting=people.filter(p=>p.st==='wait'||p.st==='walk').length;if(waiting<MAXQ)spawn();spawnT=busyEv*(5+Math.random()*4)}
  update(dt);cookTick(dt);rotiTick(dt);tehTick(dt);draw();
  document.getElementById('money').textContent='RM '+money.toFixed(2);$('lv').textContent=lv;$('xpb').style.width=(xp/needXp()*100)+'%';
  const hh=Math.floor(h),mm=Math.floor(gameMin%60);document.getElementById('clock').textContent=`${(hh%12)||12}:${String(mm).padStart(2,'0')} ${hh<12?'am':'pm'}`;
  document.getElementById('rate').textContent='♥ '+(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1);
  const evp=$('ev');if(EV.id!=='none'){evp.style.display='block';evp.textContent=EV.n+(evOn()?' · SEKARANG':'')}else evp.style.display='none';
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
