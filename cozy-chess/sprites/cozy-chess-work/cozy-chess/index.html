<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2d2440">
<title>Cozy Chess | MyCozyWorld</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="hub-link" href="../" aria-label="Back to game hub">‹ GAMES</a>
    <div class="brand"><small>MYCOZYWORLD</small><strong>Cozy Chess</strong></div>
    <button id="soundBtn" class="icon-btn" type="button" aria-label="Sound">🔊</button>
  </header>

  <!-- MENU -->
  <main id="menu" class="view">
    <div class="title-art" id="titleArt"></div>
    <h1>Cozy Chess <span>♛</span></h1>
    <p class="tag">Chess betul-betul, tapi setiap kali makan — <b>bertarung!</b></p>
    <button id="resumeBtn" class="btn gold hidden" type="button">▶ SAMBUNG GAME</button>
    <section class="card">
      <h3>Lawan AI</h3>
      <div class="seg" id="levelSeg"><button data-v="0">Senang</button><button data-v="1" class="on">Biasa</button><button data-v="2">Susah</button></div>
      <div class="seg" id="colorSeg"><button data-v="w" class="on">♔ Putih</button><button data-v="b">♚ Hitam</button><button data-v="r">🎲 Rawak</button></div>
      <button id="aiBtn" class="btn purple" type="button">⚔ MULA LAWAN AI</button>
    </section>
    <section class="card">
      <h3>2 Pemain (satu device)</h3>
      <button id="pvpBtn" class="btn pink" type="button">👥 MULA 2 PEMAIN</button>
    </section>
    <label class="toggle"><input type="checkbox" id="animToggle" checked> Animasi bertarung bila makan</label>
    <p class="ver" id="ver"></p>
  </main>

  <!-- GAME -->
  <main id="game" class="view hidden">
    <div class="player top"><span class="pname" id="topName">AI</span><span class="caps" id="topCaps"></span></div>
    <div class="board-area">
      <div id="boardWrap"><div id="board"></div></div>
    </div>
    <div class="player bottom"><span class="pname" id="botName">Kau</span><span class="caps" id="botCaps"></span></div>
    <div class="status" id="status"></div>
    <div class="actions">
      <button id="undoBtn" class="btn small" type="button">↶ Undo</button>
      <button id="animBtn" class="btn small" type="button">🎬 Animasi: ON</button>
      <button id="menuBtn" class="btn small" type="button">☰ Menu</button>
    </div>
  </main>

  <!-- BATTLE CINEMATIC -->
  <div id="battle" class="battle" aria-hidden="true">
    <div class="b-bg"></div><div class="b-floor"></div>
    <div class="b-title" id="bTitle"></div>
    <div class="fighter atk"><img alt=""><div class="ftag"></div></div>
    <div class="fighter def"><img alt=""><div class="ftag"></div></div>
    <div class="b-fx" id="bFx"></div>
    <div class="b-flash"></div>
    <div class="b-skip">tap untuk skip ›</div>
  </div>

  <!-- MODALS -->
  <div id="promo" class="modal hidden"><div class="mbox"><h3>Naik pangkat!</h3><div class="promo-row" id="promoRow"></div></div></div>
  <div id="result" class="modal hidden"><div class="mbox"><div id="resArt" class="res-art"></div><h2 id="resTitle"></h2><p id="resText"></p><button id="againBtn" class="btn gold" type="button">↻ MAIN LAGI</button><button id="resMenuBtn" class="btn small" type="button">Menu</button></div></div>
  <div id="toast" class="toast"></div>
</div>
<script src="game.js"></script>
</body>
</html>
